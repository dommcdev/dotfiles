###################
### MY PROGRAMS ###
###################
# https://wiki.hypr.land/Configuring/Keywords/

$terminal = ghostty +new-window
$fileManager = nautilus --new-window
$browser = google-chrome-stable
$notes = obsidian
$menu = vicinae toggle
$editor = ghostty -e "nvim"
$webapp = google-chrome-stable --app
$screenshot = noctalia msg screenshot-fullscreen
$screenshotArea = noctalia msg screenshot-region

# Floating TUI apps
$bluetooth = noctalia msg bluetooth-enable && ghostty --class=com.dominic.bluetui -e bluetui
$audiomixer = ghostty --class=com.dominic.wiremix -e wiremix
$calculator = ghostty --class=com.dominic.calc -e qalc
$sysmonitor = ghostty --class=com.dominic.btop -e btop
$wifi = noctalia msg wifi-enable && ghostty --class=com.dominic.impala -e impala
$power = ghostty --class=com.dominic.powerbutton -e ~/.local/bin/power-button.sh
$parabolic = flatpak run org.nickvision.tubeconverter


###################
### KEYBINDINGS ###
###################
# See https://wiki.hypr.land/Configuring/Keywords/

$mainMod = SUPER

# See https://wiki.hypr.land/Configuring/Binds/
bind = $mainMod, space, exec, $menu
bind = CTRL, apostrophe, exec, $menu
bind = ,Print, exec, $screenshot
bind = SHIFT, Print, exec, $screenshotArea
bind = $mainMod, TAB, exec, noctalia msg session lock
bind = $mainMod, grave, exec, launch-screensaver.sh
bind = $mainMod SHIFT, grave, exec, launch-screensaver.sh -l
bind = $mainMod, A, exec, noctalia msg notification-clear-active
bind = $mainMod SHIFT, A, exec, noctalia msg notification-invoke-latest
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, B, exec, $browser --incognito
bind = $mainMod, D, fullscreen, 1
bind = $mainMod SHIFT, D, fullscreen, 0
bind = $mainMod, E, exec, $bluetooth
bind = $mainMod SHIFT, F, exec, ghostty -e yazi
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, G, togglefloating,
bind = ALT, G, exec, launch-grandorgue -h
bind = ALT SHIFT, G, exec, grandorgue-layout
bind = $mainMod, I, exec, $webapp="https://gemini.google.com/app"
bind = $mainMod SHIFT, I, exec, $webapp="https://chatgpt.com"
bind = SHIFT ALT, XF86TouchpadOff, exec, $webapp="https://gemini.google.com/app" # Copilot Key
bind = $mainMod, N, exec, $notes
bind = $mainMod, O, layoutmsg, togglesplit # dwindle
bind = $mainMod SHIFT, P, exec, hyprpicker | wl-copy
bind = $mainMod, R, exec, $audiomixer
bind = $mainMod, return, exec, $terminal
bind = $mainMod, S, exec, $screenshot
bind = $mainMod SHIFT, S, exec, $screenshotArea
bind = $mainMod, T, exec, $calculator
bind = $mainMod, U, exec, $sysmonitor
bind = $mainMod, W, exec, $wifi
bind = $mainMod SHIFT, W, exec, systemctl restart iwd
bind = $mainMod, X, killactive,
bind = $mainMod, Y, exec, $parabolic
bind = $mainMod SHIFT, Y, exec, $webapp="https://youtube.com/playlist?list=WL"
bind = $mainMod, Z, togglespecialworkspace, magic
bind = $mainMod SHIFT, Z, movetoworkspace, special:magic

# Move focus with mainMod SHIFT + hjkl
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move  Windows
bind = $mainMod CTRL, h, movewindow, l
bind = $mainMod CTRL, l, movewindow, r
bind = $mainMod CTRL, k, movewindow, u
bind = $mainMod CTRL, j, movewindow, d

# Resize windows
binde = $mainMod, right, resizeactive, 40 0
binde = $mainMod, left, resizeactive, -40 0
binde = $mainMod, up, resizeactive, 0 -40
binde = $mainMod, down, resizeactive, 0 40

#bind = $mainMod, period, layoutmsg, move +col
#bind = $mainMod, comma, layoutmsg, swapcol l

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, noctalia msg volume-up
bindel = ,XF86AudioLowerVolume, exec, noctalia msg volume-down
bindel = ,XF86AudioMute, exec, noctalia msg volume-mute
bindel = ,XF86AudioMicMute, exec, noctalia msg mic-mute
bindel = ,XF86MonBrightnessUp, exec, noctalia msg brightness-up
bindel = ,XF86MonBrightnessDown, exec, noctalia msg brightness-down
bindel = ,XF86PowerOff, exec, $power

# Media playback
bindl = , XF86AudioNext, exec, noctalia msg media next
bindl = , XF86AudioPrev, exec, noctalia msg media previous
bindl = , XF86AudioPause, exec, noctalia msg media toggle
bindl = , XF86AudioPlay, exec, noctalia msg media toggle

#Misc fn keys
bindel = ,XF86Calculator, exec, $calculator
bindel = ,XF86Search, exec, $menu
