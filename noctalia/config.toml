[bar.default]
center = [ "group:g1" ]
end = [ "network", "bluetooth", "clipboard", "group:g3", "session" ]
margin_edge = 8
margin_ends = 10
radius = 0
start = [ "control-center", "launcher", "wallpaper", "workspaces", "spacer_1", "media" ]

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "clock", "date", "notifications" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "volume", "brightness", "battery" ]
    opacity = 1.0
    padding = 6.0

[brightness]
enable_ddcutil = true
minimum_brightness = 0.04999999888241291

[control_center]
sidebar_section = "none"

    [control_center.calendar]
    show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 320.0
    box_width = 576.0
    cx = 608.0
    cy = 1072.0
    output = "DP-2"
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false
        background_opacity = 0.0
        bands = 32
        color_2 = "secondary"
        show_when_idle = false

[keybinds]
down = [ "Down", "Ctrl+j" ]
left = [ "Left", "Ctrl+h" ]
right = [ "Right", "Ctrl+l" ]
up = [ "Up", "Ctrl+k" ]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[nightlight]
enabled = true
temperature_night = 4700

[notification]
layer = "overlay"

[shell]
avatar_path = "/home/dominic/Downloads/Shared/Images/Profile.png"
clipboard_enabled = false
corner_radius_scale = 0.0
telemetry_enabled = true

    [shell.launcher]
    session_search = true

    [shell.panel]
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_session = true
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    size = 42

    [shell.screenshot]
    directory = "/home/dominic/Downloads/Screenshots"

[theme]
builtin = "Gruvbox"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "qt", "starship" ]
    community_ids = [ "pywalfox", "zen-browser", "neovim", "obsidian", "zed", "vicinae", "papirus-icons", "yazi", "hyprtoolkit" ]

[wallpaper]
directory = "/home/dominic/dev/wallpapers"

    [wallpaper.default]
    path = "/home/dominic/dev/wallpapers/catppuccin/view-vent.png"

    [wallpaper.last]
    path = "/home/dominic/dev/wallpapers/catppuccin/view-vent.png"

    [wallpaper.monitors.DP-2]
    path = "/home/dominic/dev/wallpapers/catppuccin/view-vent.png"

[weather]
refresh_minutes = 15
unit = "imperial"

[widget.brightness]
enabled = true

[widget.clipboard]
enabled = false

[widget.control-center]
enabled = true

[widget.launcher]
enabled = false

[widget.media]
enabled = false

[widget.spacer_1]
enabled = false
type = "spacer"

[widget.spacer_2]
enabled = true
type = "spacer"

[widget.tray]
enabled = false

[widget.wallpaper]
enabled = false
