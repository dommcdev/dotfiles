- link:
    ~/.config/hypr:
      path: hyprland/*
      glob: true
      exclude: [hyprland/uwsm]
    ~/.config/uwsm:
      path: hyprland/uwsm/*
      glob: true

- shell:
    - sudo pacman -S --noconfirm --needed uwsm libnewt xdg-desktop-portal-hyprland xdg-desktop-portal-gtk hyprland satty hyprland-qt-support

    # Don't let systemd-logind handle power button - let hyprland use it
    - sudo sed -i 's/.*HandlePowerKey=.*/HandlePowerKey=ignore/' /etc/systemd/logind.conf
