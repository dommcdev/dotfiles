
- link:
    ~/.config/hypr:
      path: hypr/*
      glob: true
      exclude: [hypr/uwsm, hypr/hypridle*.conf]
    ~/.config/uwsm:
      path: hypr/uwsm/*
      glob: true
    ~/.config/hypr/hypridle.conf:
      path: hypr/hypridle-laptop.conf
      if: '[ "$(./sys power)" = "1" ]'
    ~/.config/systemd/user:
      path: hypr/systemd/*
      glob: true

- link:
    ~/.config/hypr/hypridle.conf:
      path: hypr/hypridle.conf
      if: '[ "$(./sys power)" = "0" ]'

- shell:
  - sudo pacman -S --noconfirm --needed uwsm libnewt xdg-desktop-portal-hyprland xdg-desktop-portal-gtk hyprland hyprlock hypridle hyprpaper hyprpicker hyprsunset grim slurp hyprpolkitagent satty
  - systemctl --user enable hyprpolkitagent.service
  - systemctl --user enable hyprpaper.service
  - systemctl --user enable hypridle.service
  - systemctl --user enable hyprsunset.service

  # Don't let systemd-logind handle power button - let hyprland use it
  - sudo sed -i 's/.*HandlePowerKey=.*/HandlePowerKey=ignore/' /etc/systemd/logind.conf


