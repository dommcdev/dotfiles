- name: Configure dotfiles
  hosts: all
  gather_facts: true

  pre_tasks:

  tasks:
    - name: Misc bootstrap, distro, hardware, and small tools
      ansible.builtin.include_tasks: tasks/misc.yml

    - name: Drivers
      ansible.builtin.include_tasks: tasks/drivers.yml
      when: is_custom and is_linux

    - name: Headless-safe terminal tools
      ansible.builtin.include_tasks: tasks/terminal.yml

    - name: Small configured TUI tools
      ansible.builtin.include_tasks: tasks/tui.yml

    - name: Yazi
      ansible.builtin.include_tasks: tasks/yazi.yml

    - name: Script links
      ansible.builtin.include_tasks: tasks/scripts.yml

    - name: Git
      ansible.builtin.include_tasks: tasks/git.yml

    - name: Zsh
      ansible.builtin.include_tasks: tasks/zsh.yml

    - name: Neovim
      ansible.builtin.include_tasks: tasks/nvim.yml

    - name: Tmux
      ansible.builtin.include_tasks: tasks/tmux.yml

    - name: SSH
      ansible.builtin.include_tasks: tasks/ssh.yml

    - name: Docker
      ansible.builtin.include_tasks: tasks/docker.yml

    - name: Syncthing
      ansible.builtin.include_tasks: tasks/syncthing.yml

    - name: Tailscale
      ansible.builtin.include_tasks: tasks/tailscale.yml

    - name: Opencode
      ansible.builtin.include_tasks: tasks/opencode.yml

    - name: Network stack
      ansible.builtin.include_tasks: tasks/network.yml
      when: is_arch and is_linux

    - name: Desktop GUI apps
      ansible.builtin.include_tasks: tasks/gui.yml
      when: is_desktop

    - name: macOS-specific setup
      ansible.builtin.include_tasks: tasks/mac.yml
      when: is_macos and is_desktop

    - name: Ghostty
      ansible.builtin.include_tasks: tasks/ghostty.yml
      when: is_desktop

    - name: Look and feel
      ansible.builtin.include_tasks: tasks/looknfeel.yml
      when: is_custom

    - name: Keyd
      ansible.builtin.include_tasks: tasks/keyd.yml
      when: is_custom and is_linux

    - name: Printing
      ansible.builtin.include_tasks: tasks/printing.yml
      when: is_custom and is_linux

    - name: Virtualization
      ansible.builtin.include_tasks: tasks/virtualization.yml
      when: is_custom and is_linux

    - name: Hyprland
      ansible.builtin.include_tasks: tasks/hypr.yml
      when: is_custom and is_arch

    - name: Vicinae
      ansible.builtin.include_tasks: tasks/vicinae.yml
      when: is_custom and is_arch

    - name: SDDM
      ansible.builtin.include_tasks: tasks/sddm.yml
      when: is_custom and is_arch
