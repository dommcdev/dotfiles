- name: Install appearance packages
  block:
    - name: Install native appearance packages
      ansible.builtin.package:
        name: "{{ pkgs[ansible_facts['os_family']] }}"
        state: present
      become: true
      when: ansible_facts['os_family'] in pkgs
      vars:
        pkgs:
          Archlinux:
            - noto-fonts
            - noto-fonts-cjk
            - noto-fonts-emoji
            - noto-fonts-extra
            - ttf-jetbrains-mono-nerd
            - adw-gtk-theme
            - qt5-wayland
            - qt6-wayland
            - breeze
            - breeze-icons
            - papirus-icon-theme
          Debian:
            - breeze-cursor-theme
          RedHat:
            - breeze-cursor-theme

    - name: Install JetBrains Mono Nerd Font on macOS
      community.general.homebrew_cask:
        name: font-jetbrains-mono-nerd-font
        state: present
        update_homebrew: false
      when: is_macos

    - name: Install qt6ct-kde on Arch
      kewlfft.aur.aur:
        name: qt6ct-kde
        state: present
      when: is_arch

- name: Link Linux appearance config
  when: is_linux
  block:
    - name: Create config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ home }}/.config/fontconfig"
        - "{{ home }}/.config/qt6ct"
        - "{{ home }}/.config/gtk-3.0"
        - "{{ home }}/.config/gtk-4.0"

    - name: Link fontconfig
      ansible.builtin.file:
        src: "{{ root }}/styling/fonts/fonts.conf"
        dest: "{{ home }}/.config/fontconfig/fonts.conf"
        state: link
        force: true

    - name: Link GTK configs
      ansible.builtin.file:
        src: "{{ root }}/styling/gtk/{{ item.src }}"
        dest: "{{ home }}/.config/{{ item.dest }}"
        state: link
        force: true
      loop:
        - src: gtk-3.0/gtk.css
          dest: gtk-3.0/gtk.css
        - src: gtk-4.0/gtk.css
          dest: gtk-4.0/gtk.css
        - src: gtk-4.0/settings.ini
          dest: gtk-4.0/settings.ini
        - src: templates
          dest: templates
        - src: user-dirs.dirs
          dest: user-dirs.dirs
        - src: mimeapps.list
          dest: mimeapps.list

    - name: Link qt6ct config
      ansible.builtin.file:
        src: "{{ root }}/styling/qt/qt6ct.conf"
        dest: "{{ home }}/.config/qt6ct/qt6ct.conf"
        state: link
        force: true

- name: Configure Linux desktop appearance
  when: is_linux and is_managed_desktop
  block:
    - name: Configure Flatpak GTK filesystem overrides
      ansible.builtin.command: "flatpak override --user --filesystem={{ item }}"
      changed_when: false
      loop:
        - xdg-config/gtk-4.0
        - xdg-config/gtk-3.0

    - name: Configure desktop appearance
      ansible.builtin.command: "gsettings set org.gnome.desktop.interface {{ item.key }} {{ item.value }}"
      changed_when: false
      loop:
        - key: gtk-theme
          value: adw-gtk3
        - key: color-scheme
          value: prefer-dark
        - key: icon-theme
          value: Papirus-Dark
        - key: font-name
          value: "'Adwaita Sans 11'"

    - name: Create default cursor directory
      ansible.builtin.file:
        path: "{{ home }}/.local/share/icons/default"
        state: directory
        mode: "0755"

    - name: Configure xwayland cursor inheritance
      ansible.builtin.copy:
        dest: "{{ home }}/.local/share/icons/default/index.theme"
        mode: "0644"
        content: |
          [Icon Theme]
          Name=Default
          Comment=Default Cursor Theme
          Inherits=breeze_cursors
