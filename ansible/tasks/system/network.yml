- name: Install network packages
  ansible.builtin.package:
    name: "{{ pkgs[ansible_facts['os_family']] }}"
    state: present
  become: true
  when: ansible_facts['os_family'] in pkgs
  vars:
    pkgs:
      Archlinux:
        - networkmanager
        - network-manager-applet
        - nm-connection-editor
        - iwd
        - inetutils
        - nftables
        - iptables
      Debian:
        - network-manager
        - network-manager-gnome
        - iwd
        - inetutils-tools
        - systemd-resolved
        - nftables
        - iptables
      RedHat:
        - NetworkManager
        - NetworkManager-wifi
        - network-manager-applet
        - nm-connection-editor
        - iwd
        - systemd-resolved
        - nftables
        - iptables-nft

- name: Configure NetworkManager
  block:
    - name: Create config directory
      ansible.builtin.file:
        path: /etc/NetworkManager/conf.d
        state: directory
        mode: "0755"
      become: true

    - name: Copy config
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/90-dotfiles.conf
        mode: "0644"
        content: |
          [main]
          # Let systemd-resolved manage DNS
          dns=systemd-resolved
          # Optional: rc-manager controls how NM handles /etc/resolv.conf
          rc-manager=symlink

          [keyfile]
          unmanaged-devices=interface-name:tailscale0

          [device]
          # Use iwd for Wi-Fi
          wifi.backend=iwd

          [connectivity]
          uri=http://www.archlinux.org/check_network_status.txt
          interval=300

          [logging]
          backend=journal
          audit=true

          [connection]
          # Set systemd-resolved to resolve-only to prevent unintentionally activing its mDNS responder
          connection.mdns=1
      become: true
      register: networkmanager_config

    - name: Disable NetworkManager-wait-online to speed up boot
      ansible.builtin.systemd_service:
        name: NetworkManager-wait-online.service
        enabled: false
        masked: true
      become: true

- name: Configure systemd-resolved
  block:
    - name: Create resolved override directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"
      become: true

    # Dedicated responders such as Avahi handle mDNS advertising and discovery.
    - name: Set systemd-resolved mDNS to resolve-only
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/10-mdns-resolve.conf
        mode: "0644"
        content: |
          [Resolve]
          MulticastDNS=resolve
          LLMNR=no
      become: true
      register: resolved_config

- name: Enable/restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved.service
    enabled: true
    state: "{{ 'restarted' if resolved_config.changed else 'started' }}"
  become: true

- name: Link systemd-resolved stub resolver
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  become: true

- name: Enable TCP MTU probing
  ansible.builtin.lineinfile:
    path: /etc/sysctl.d/99-sysctl.conf
    line: net.ipv4.tcp_mtu_probing=1
    create: true
    mode: "0644"
  become: true
  when: is_linux

- name: Enable/restart NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    enabled: true
    state: "{{ 'restarted' if networkmanager_config.changed else 'started' }}"
  become: true
