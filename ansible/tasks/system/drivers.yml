- name: Detect graphics hardware vendors
  ansible.builtin.shell:
    cmd: |
      for device in /sys/bus/pci/devices/*; do
        [ -r "$device/class" ] || continue
        case "$(cat "$device/class")" in
          0x03*) cat "$device/vendor" ;;
        esac
      done
    executable: /bin/sh
  register: gpu_pci_vendor_ids
  changed_when: false

- name: Set graphics hardware vendors
  ansible.builtin.set_fact:
    gpu_vendors: >-
      {{
        (['amd'] if '0x1002' in gpu_pci_vendor_ids.stdout_lines else [])
        + (['intel'] if '0x8086' in gpu_pci_vendor_ids.stdout_lines else [])
        + (['nvidia'] if '0x10de' in gpu_pci_vendor_ids.stdout_lines else [])
      }}

- name: Install graphics drivers, firmware and multi-media codecs
  vars:
    pkgs:
      Archlinux:
        - gst-libav
        - gst-plugin-pipewire
        - gst-plugin-va
        - gst-plugins-bad
        - gst-plugins-base
        - gst-plugins-base-libs
        - gst-plugins-good
        - gst-plugins-ugly
        - libva-utils
        - linux-firmware
        - mesa-utils
        - sof-firmware
        - vulkan-tools
      RedHat:
        - alsa-sof-firmware
        - gstreamer1-libav
        - gstreamer1-plugin-openh264
        - gstreamer1-plugins-bad-free
        - gstreamer1-plugins-bad-free-extras
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-base
        - gstreamer1-plugins-good
        - gstreamer1-plugins-ugly
        - gstreamer1-vaapi
        - libva-utils
        - linux-firmware
        - mesa-demos
        - vulkan-tools
      Debian:
        - firmware-sof-signed
        - gstreamer1.0-libav
        - gstreamer1.0-plugins-bad
        - gstreamer1.0-plugins-base
        - gstreamer1.0-plugins-good
        - gstreamer1.0-plugins-ugly
        - gstreamer1.0-vaapi
        - libavcodec-extra
        - linux-firmware
        - mesa-utils
        - vainfo
        - vulkan-tools
  ansible.builtin.package:
    name: "{{ pkgs[ansible_facts['os_family']] }}"
    state: present
  become: true
  when: ansible_facts['os_family'] in pkgs

- name: Install AMD graphics support
  vars:
    pkgs:
      Archlinux:
        - lib32-mesa
        - lib32-vulkan-radeon
        - linux-firmware-amdgpu
        - mesa
        - vulkan-radeon
      RedHat:
        - amd-gpu-firmware
        - mesa-dri-drivers
        - mesa-dri-drivers.i686
        - mesa-vulkan-drivers
        - mesa-vulkan-drivers.i686
      Debian:
        - libgl1-mesa-dri
        - mesa-va-drivers
        - mesa-vdpau-drivers
        - mesa-vulkan-drivers
  when: "'amd' in gpu_vendors"
  block:
    - name: Install AMD drivers and firmware
      ansible.builtin.package:
        name: "{{ pkgs[ansible_facts['os_family']] }}"
        state: present
      become: true
      when: ansible_facts['os_family'] in pkgs

    - name: Install unrestricted AMD video codecs on Fedora
      ansible.builtin.dnf:
        name:
          - mesa-va-drivers-freeworld
          - mesa-va-drivers-freeworld.i686
        state: present
        allowerasing: true
      become: true
      when: is_fedora

- name: Install Intel graphics support
  vars:
    pkgs:
      Archlinux:
        - intel-media-driver
        - lib32-mesa
        - lib32-vulkan-intel
        - linux-firmware-intel
        - mesa
        - vulkan-intel
      RedHat:
        - intel-gpu-firmware
        - intel-media-driver
        - mesa-dri-drivers
        - mesa-dri-drivers.i686
        - mesa-vulkan-drivers
        - mesa-vulkan-drivers.i686
      Debian:
        - intel-media-va-driver-non-free
        - libgl1-mesa-dri
        - mesa-vulkan-drivers
  ansible.builtin.package:
    name: "{{ pkgs[ansible_facts['os_family']] }}"
    state: present
  become: true
  when:
    - "'intel' in gpu_vendors"
    - ansible_facts['os_family'] in pkgs

- name: Install NVIDIA graphics support
  when: "'nvidia' in gpu_vendors"
  block:
    - name: Find installed Arch kernel module directories
      ansible.builtin.find:
        paths: /usr/lib/modules
        patterns: pkgbase
        recurse: true
        file_type: file
      register: arch_kernel_pkgbases
      when: is_arch

    - name: Find packages owning the installed Arch kernels
      ansible.builtin.command: "pacman --query --owns --quiet {{ item.path }}"
      loop: "{{ arch_kernel_pkgbases.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      register: arch_kernel_owners
      changed_when: false
      failed_when: false
      when: is_arch

    - name: Install headers for all installed Arch kernels
      ansible.builtin.package:
        name: "{{ item.stdout }}-headers"
        state: present
      become: true
      loop: "{{ arch_kernel_owners.results | default([]) | selectattr('rc', 'equalto', 0) }}"
      loop_control:
        label: "{{ item.stdout }}-headers"
      when: is_arch

    - name: Install NVIDIA open DKMS drivers on Arch
      ansible.builtin.package:
        name:
          - lib32-nvidia-utils
          - linux-firmware-nvidia
          - nvidia-open-dkms
          - nvidia-settings
          - nvidia-utils
        state: present
      become: true
      when: is_arch

    - name: Find the newest Ubuntu NVIDIA open driver
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          apt-cache pkgnames nvidia-driver- |
          grep -E '^nvidia-driver-[0-9]+-open$' |
          sort -V |
          tail -n 1
        executable: /bin/bash
      register: ubuntu_nvidia_open_driver
      changed_when: false
      failed_when: ubuntu_nvidia_open_driver.stdout | length == 0
      when: is_ubuntu

    - name: Install NVIDIA open kernel drivers on Ubuntu
      ansible.builtin.package:
        name:
          - "{{ ubuntu_nvidia_open_driver.stdout }}"
          - nvidia-settings
        state: present
      become: true
      when: is_ubuntu

    - name: Install NVIDIA open kernel drivers and firmware on Fedora
      ansible.builtin.package:
        name:
          - akmod-nvidia-open
          - nvidia-gpu-firmware
          - nvidia-settings
          - xorg-x11-drv-nvidia-cuda
          - xorg-x11-drv-nvidia-libs.i686
        state: present
      become: true
      when: is_fedora
