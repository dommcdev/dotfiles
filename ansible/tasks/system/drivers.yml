- name: Detect graphics hardware vendors
  ansible.builtin.shell:
    cmd: |
      for device in /sys/bus/pci/devices/*; do
        [ -r "$device/class" ] || continue
        case "$(cat "$device/class")" in
          0x03*) cat "$device/vendor" ;;
        esac
      done
    executable: /bin/sh
  register: gpu_pci_vendor_ids
  changed_when: false

- name: Set graphics hardware vendors
  ansible.builtin.set_fact:
    gpu_vendors: >-
      {{
        (['amd'] if '0x1002' in gpu_pci_vendor_ids.stdout_lines else [])
        + (['intel'] if '0x8086' in gpu_pci_vendor_ids.stdout_lines else [])
        + (['nvidia'] if '0x10de' in gpu_pci_vendor_ids.stdout_lines else [])
      }}

- name: Install graphics drivers, firmware and multi-media codecs
  vars:
    pkgs:
      Archlinux:
        - gst-libav
        - gst-plugin-pipewire
        - gst-plugin-va
        - gst-plugins-bad
        - gst-plugins-base
        - gst-plugins-base-libs
        - gst-plugins-good
        - gst-plugins-ugly
        - libva-utils
        - linux-firmware
        - mesa-utils
        - sof-firmware
        - vulkan-tools
      RedHat:
        - alsa-sof-firmware
        - gstreamer1-libav
        - gstreamer1-plugin-openh264
        - gstreamer1-plugins-bad-free
        - gstreamer1-plugins-bad-free-extras
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-base
        - gstreamer1-plugins-good
        - gstreamer1-plugins-ugly
        - gstreamer1-vaapi
        - libva-utils
        - linux-firmware
        - mesa-demos
        - vulkan-tools
      Debian:
        - firmware-sof-signed
        - gstreamer1.0-libav
        - gstreamer1.0-plugins-bad
        - gstreamer1.0-plugins-base
        - gstreamer1.0-plugins-good
        - gstreamer1.0-plugins-ugly
        - gstreamer1.0-vaapi
        - libavcodec-extra
        - linux-firmware
        - mesa-utils
        - vainfo
        - vulkan-tools
  ansible.builtin.package:
    name: "{{ pkgs[ansible_facts['os_family']] }}"
    state: present
  become: true
  when: ansible_facts['os_family'] in pkgs

- name: Install AMD graphics support
  vars:
    pkgs:
      Archlinux:
        - linux-firmware-amdgpu
        - mesa
        - vulkan-radeon
      RedHat:
        - amd-gpu-firmware
        - mesa-dri-drivers
        - mesa-vulkan-drivers
      Debian:
        - libgl1-mesa-dri
        - mesa-va-drivers
        - mesa-vdpau-drivers
        - mesa-vulkan-drivers
  when:
    - manage_gpu
    - "'amd' in gpu_vendors"
  block:
    - name: Install AMD drivers and firmware
      ansible.builtin.package:
        name: "{{ pkgs[ansible_facts['os_family']] }}"
        state: present
      become: true
      when: ansible_facts['os_family'] in pkgs

    - name: Install unrestricted AMD video codecs on Fedora
      ansible.builtin.dnf:
        name:
          - mesa-va-drivers-freeworld
        state: present
        allowerasing: true
      become: true
      when: is_fedora

- name: Install Intel graphics support
  vars:
    pkgs:
      Archlinux:
        - intel-media-driver
        - linux-firmware-intel
        - mesa
        - vulkan-intel
      RedHat:
        - intel-gpu-firmware
        - intel-media-driver
        - mesa-dri-drivers
        - mesa-vulkan-drivers
      Debian:
        - intel-media-va-driver-non-free
        - libgl1-mesa-dri
        - mesa-vulkan-drivers
  ansible.builtin.package:
    name: "{{ pkgs[ansible_facts['os_family']] }}"
    state: present
  become: true
  when:
    - manage_gpu
    - "'intel' in gpu_vendors"
    - ansible_facts['os_family'] in pkgs

- name: Install NVIDIA graphics support
  when:
    - manage_gpu
    - "'nvidia' in gpu_vendors"
  block:
    - name: Find headers for installed Arch kernels
      ansible.builtin.shell:
        cmd: |
          for pkgbase in /usr/lib/modules/*/pkgbase; do
            [ -r "$pkgbase" ] && printf '%s-headers\n' "$(cat "$pkgbase")"
          done
        executable: /bin/sh
      register: arch_kernel_headers
      changed_when: false
      when: is_arch

    - name: Install headers for all installed Arch kernels
      ansible.builtin.package:
        name: "{{ arch_kernel_headers.stdout_lines | default([]) | unique }}"
        state: present
      become: true
      when: is_arch

    - name: Install NVIDIA open DKMS drivers on Arch
      ansible.builtin.package:
        name:
          - libva-nvidia-driver
          - linux-firmware-nvidia
          - nvidia-open-dkms
          - nvidia-settings
          - nvidia-utils
        state: present
      become: true
      when: is_arch

    - name: Find the newest Ubuntu NVIDIA open driver
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          apt-cache pkgnames nvidia-driver- |
          grep -E '^nvidia-driver-[0-9]+-open$' |
          sort -V |
          tail -n 1
        executable: /bin/bash
      register: ubuntu_nvidia_open_driver
      changed_when: false
      failed_when: ubuntu_nvidia_open_driver.stdout | length == 0
      when: is_ubuntu

    - name: Install NVIDIA open kernel drivers on Ubuntu
      ansible.builtin.package:
        name:
          - "{{ ubuntu_nvidia_open_driver.stdout }}"
          - nvidia-vaapi-driver
          - nvidia-settings
        state: present
      become: true
      when: is_ubuntu

    - name: Install NVIDIA drivers on Fedora
      ansible.builtin.package:
        name:
          - akmod-nvidia
          - libva-nvidia-driver
          - nvidia-settings
          - xorg-x11-drv-nvidia-cuda
        state: present
      become: true
      when: is_fedora
# NOTE: Older Intel GPUs may require libva-intel-driver instead of intel-media-driver.
# NOTE: NVIDIA open kernel modules only support Turing and newer GPUs.
