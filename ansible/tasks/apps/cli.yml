- name: Install terminal packages
  vars:
    pkgs:
      Archlinux:
        - ouch
        - unzip
        - 7zip
        - unarchiver
        - unrar
        - wget
        - curl
        - ffmpeg
        - fd
        - ripgrep
        - poppler
        - zoxide
        - imagemagick
        - chafa
        - resvg
        - ncdu
        - fzf
        - trash-cli
        - tealdeer
        - whois
        - eza
        - jq
        - less
        - yt-dlp
        - gum
        - git-delta
        - difftastic
        - nmap
        - bind
        - lazygit
        - acpi
        - caligula
        - dust
        - glow
        - playerctl
        - duf
        - figlet
        - man-db
        - man-pages
        - bc
        - id3v2
      Debian:
        - unzip
        - 7zip
        - unar
        - unrar
        - trash-cli
        - wget
        - ffmpeg
        - fd-find
        - ripgrep
        - poppler-utils
        - zoxide
        - imagemagick
        - ghostscript
        - chafa
        - ncdu
        - eza
        - jq
        - less
        - git-delta
        - nmap
        - bind9-dnsutils
        - playerctl
        - duf
        - figlet
        - bc
        - id3v2
      RedHat:
        - unzip
        - 7zip
        - unar
        - unrar
        - trash-cli
        - wget
        - fd-find
        - ripgrep
        - poppler-utils
        - zoxide
        - ImageMagick
        - ghostscript
        - chafa
        - ncdu
        - eza
        - jq
        - less
        - git-delta
        - nmap
        - bind-utils
        - playerctl
        - duf
        - figlet
        - bc
        - id3v2
    brew_pkgs:
      - fzf
      - yt-dlp
      - tealdeer
      - resvg
      - gum
      - ouch
      - dust
      - glow
      - difftastic
      - caligula
      - hunk
    macos_brew_pkgs:
      - ouch
      - unzip
      - 7zip
      - unar
      - ffmpeg
      - wget
      - fd
      - ripgrep
      - poppler
      - zoxide
      - imagemagick
      - ghostscript
      - chafa
      - resvg
      - ncdu
      - fzf
      - tealdeer
      - eza
      - jq
      - less
      - yt-dlp
      - gum
      - git-delta
      - nmap
      - bind
      - dust
      - glow
      - duf
      - figlet
      - difftastic
      - bc
      - id3v2
      - caligula
      - hunk
  block:
    - name: Install native terminal packages
      ansible.builtin.package:
        name: "{{ pkgs[ansible_facts['os_family']] }}"
        state: present
      become: true
      when: ansible_facts['os_family'] in pkgs

    - name: Install unrestricted FFmpeg on Fedora
      ansible.builtin.dnf:
        name: ffmpeg
        state: present
        allowerasing: true
      become: true
      when: is_fedora

    - name: Tap and trust the Caligula Homebrew repository
      community.general.homebrew_tap:
        name: philocalyst/tap
        state: present
        trust: true
      when: is_ubuntu or is_fedora or is_macos

    - name: Install terminal Homebrew packages on Linux
      community.general.homebrew:
        name: "{{ brew_pkgs }}"
        state: present
        update_homebrew: false
      when: is_ubuntu or is_fedora

    - name: Install terminal Homebrew packages on macOS
      community.general.homebrew:
        name: "{{ macos_brew_pkgs }}"
        state: present
        update_homebrew: false
      when: is_macos

    - name: Install Hunk with Bun on Arch
      ansible.builtin.command: bun add -g hunkdiff
      changed_when: false
      when: is_arch

- name: Install Ansible tooling
  block:
    - name: Create Ansible state directory
      ansible.builtin.file:
        path: "{{ home }}/.local/state/ansible"
        state: directory
        mode: "0700"

    - name: Install Ansible tooling on Arch
      ansible.builtin.package:
        name:
          - ansible
          - ansible-lint
          - yamllint
        state: present
      become: true
      when: is_arch

    - name: Install Ansible tooling with Homebrew
      community.general.homebrew:
        name:
          - ansible
          - ansible-lint
          - yamllint
        state: present
        update_homebrew: false
      when: is_ubuntu or is_fedora or is_macos

    - name: Install Ansible Galaxy requirements
      ansible.builtin.command:
        # Add --force to refresh collections installed from Git branches.
        cmd: ansible-galaxy collection install --requirements-file "{{ root }}/ansible/requirements.yml"
      register: ansible_galaxy_requirements
      changed_when: "'installed successfully' in ansible_galaxy_requirements.stdout"

- name: Install fun terminal programs
  when: is_arch and is_managed_desktop
  block:
    - name: Install native packages
      ansible.builtin.package:
        name:
          - perl-curses
          - perl-term-animation
          - cowsay
          - ponysay
          - countryfetch
          - lolcat
          - fortune-mod
          - sl
          - espeak-ng
          - toilet
          - nyancat
        state: present
      become: true

    - name: Install AUR packages
      become: true
      become_user: aur_builder
      kewlfft.aur.aur:
        name:
          - cmatrix-git
          - lavat-git
        state: present
# TODO Add terminal-browser?

# Note: Borg v2 will bring breaking changes, might need to pin pkgs or smth then
- name: Install Borg
  vars:
    borg_packages:
      Archlinux: borg
      Debian: borgbackup
      RedHat: borgbackup
  block:
    - name: Install Borg with the native package manager
      ansible.builtin.package:
        name: "{{ borg_packages[ansible_facts['os_family']] }}"
        state: present
      become: true
      when: ansible_facts['os_family'] in borg_packages
