- name: Install and configure T3 Code
  when: is_arch
  block:
    - name: Install T3 Code
      community.general.pacman:
        name: t3code-bin
        state: present
      become: true

    - name: Create config directory
      ansible.builtin.file:
        path: "{{ home }}/.t3/userdata"
        state: directory
        mode: "0755"

    - name: Link config files
      ansible.builtin.file:
        src: "{{ root }}/t3code/{{ item }}"
        dest: "{{ home }}/.t3/userdata/{{ item }}"
        state: link
        force: true
      loop:
        - settings.json
        - keybindings.json
        - client-settings.json
