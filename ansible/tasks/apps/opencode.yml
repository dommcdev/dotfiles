- name: Configure opencode
  block:
    - name: Create config directory
      ansible.builtin.file:
        path: "{{ home }}/.config/opencode"
        state: directory
        mode: "0755"

    - name: Link config files
      ansible.builtin.file:
        src: "{{ root }}/opencode/{{ item }}"
        dest: "{{ home }}/.config/opencode/{{ item }}"
        state: link
        force: true
      loop:
        - opencode.json
        - tui.json

- name: Install opencode with Bun
  ansible.builtin.command: bun add -g opencode-ai
  changed_when: false
