- name: Install development packages on Arch
  ansible.builtin.package:
    name:
      - jdk-openjdk
      - clang
      - python
      - python-pip
      - deno
      - uv
      - github-cli
      - nodejs
      - npm
      - rust
    state: present
  become: true
  when: is_arch

- name: Install development packages with Homebrew
  community.general.homebrew:
    name:
      - java
      - llvm
      - python
      - typst
      - deno
      - uv
    state: present
    update_homebrew: false
  when: is_ubuntu or is_fedora or is_macos

- name: Install GitHub CLI for repo setup with Homebrew
  community.general.homebrew:
    name: gh
    state: present
    update_homebrew: false
  when: is_ubuntu or is_fedora or is_macos

- name: Ensure dev directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ home }}/dev/projects"
    - "{{ home }}/dev/external"

- name: Install gh markdown preview extension
  ansible.builtin.command: gh extension install yusukebe/gh-markdown-preview
  changed_when: false
  failed_when: false

- name: Use SSH remote for dotfiles repo
  community.general.git_config:
    name: remote.origin.url
    value: git@github.com:dommcdev/dotfiles.git
    scope: local
    repo: "{{ root }}"

- name: Use SSH remote for wallpapers repo
  community.general.git_config:
    name: remote.origin.url
    value: git@github.com:dommcdev/wallpapers.git
    scope: local
    repo: "{{ home }}/dev/wallpapers"

- name: Configure beancount tools
  block:
    - name: Install beancount AUR tools on Arch
      kewlfft.aur.aur:
        name:
          - beancount
          - fava
        state: present
      when: is_arch

    - name: Install beancount tools with Homebrew
      community.general.homebrew:
        name:
          - beancount
          - fava
          - rust
        state: present
        update_homebrew: false
      when: is_ubuntu or is_fedora or is_macos

    - name: Clone beans repo
      ansible.builtin.command: gh repo clone dommcdev/beans "{{ home }}/dev/beans"
      args:
        creates: "{{ home }}/dev/beans"
