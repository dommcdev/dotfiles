- name: Install Syncthing
  block:
    - name: Install on Linux
      ansible.builtin.package:
        name: syncthing
        state: present
      become: true
      when: is_linux

    - name: Install on macOS
      community.general.homebrew:
        name: syncthing
        state: present
        update_homebrew: false
      when: is_macos

- name: Enable Syncthing
  block:
    - name: Enable Linux user service
      ansible.builtin.systemd_service:
        name: syncthing.service
        enabled: true
        state: started
        scope: user
      when: is_linux and not is_headless

    - name: Enable Linux system service
      ansible.builtin.systemd_service:
        name: "syncthing@{{ user }}.service"
        enabled: true
        state: started
      become: true
      when: is_linux and is_headless

    - name: Enable Homebrew service
      community.general.homebrew_services:
        name: syncthing
        state: present
      when: is_macos
#
# Manual setup instructions
# I use the hub-and-spoke approach. All devices sync to chocobo (and not to each other).
#
# Chocobo (Hub)
# Open the settings panel and...
#   Turn off all 4 discovery options (local, global, nat, relay).
#   Change the GUI listen address to <machine.ip>:8384 and set a GUI password
#   Select "Use https for GUI"
# Finally click "Show ID" and copy the ID string.
#
# Machines (Spokes)
# Open the settings panel and...
#   Turn off all 4 discovery options (local, global, nat, relay)
# Then click "Add remote device" and...
#   Enter chocobo's ID string
#   Select "Auto Accept" (UNLESS on a phone)
#   Change "Addresses" from dynamic to tcp://chocobo:22000
# Then open chocobo's interface and...
#   Click accept (keep addresses as dynamic)
#   Select the folders you wish to share
#
# Adding folders
# Open chocobo's interface, and...
#   Click "Add folder" and pick the local path
#   Share with every device; They will auto-accept.
