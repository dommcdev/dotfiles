- name: Install Tailscale on Arch
  ansible.builtin.package:
    name: tailscale
    state: present
  become: true
  when: is_arch

- name: Install Tailscale on Ubuntu and Fedora
  when: is_ubuntu or is_fedora
  block:
    - name: Download installer
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale_install.sh
        mode: "0755"

    - name: Run installer
      ansible.builtin.command: /tmp/tailscale_install.sh
      args:
        creates: /usr/bin/tailscale
      become: true

- name: Install Tailscale app on macOS
  community.general.homebrew_cask:
    name: tailscale-app
    state: present
    update_homebrew: false
  when: is_macos

- name: Enable tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: started
  become: true
  when: is_linux

- name: Authenticate Tailscale
  when: is_linux
  block:
    - name: Check authentication state
      ansible.builtin.command:
        argv:
          - tailscale
          - status
          - --json
      become: true
      register: tailscale_status
      changed_when: false

    - name: Record authentication state
      ansible.builtin.set_fact:
        tailscale_backend_state: >-
          {{ (tailscale_status.stdout | from_json).BackendState | default('Unknown') }}

    - name: Require an auth key when Tailscale needs login
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} needs Tailscale authentication. Add a single-use
          tailscale_auth_key to .env and rerun the playbook.
      when:
        - tailscale_backend_state == 'NeedsLogin'
        - ts_auth_key is not defined or ts_auth_key | length == 0

    - name: Start and authenticate Tailscale
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - "--auth-key={{ ts_auth_key }}"
          - --reset
      become: true
      changed_when: false
      no_log: true
      when:
        - tailscale_backend_state == 'NeedsLogin'
        - ts_auth_key is defined
        - ts_auth_key | length > 0

    - name: Remove used single-use Tailscale auth key
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../.env"
        regexp: '^\s*tailscale_auth_key\s*='
        state: absent
      delegate_to: localhost
      become: false
      when:
        - tailscale_backend_state == 'NeedsLogin'
        - ts_auth_key is defined
        - ts_auth_key | length > 0

- name: Configure Tailscale options
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - --ssh
      - "--operator={{ user }}"
  become: true
  changed_when: false
  when: is_linux
#
#
# Subnet router note: Using --accept-routes DOES NOT WORK when on the same network as
# the subnet router WHEN that subnet router is off. Turn it on or off with
# tailscale set --accept-routes=[true|false]
#
# To turn exit node on, do
#   tailscale set --exit-node=[name]
# To turn off, do
#   tailscale set --exit-node=
#
# tailscale wait (tailscale-online.target) might prove useful if we ever run into timing issues
