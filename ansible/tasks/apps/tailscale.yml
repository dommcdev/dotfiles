- name: Install Tailscale on Arch
  ansible.builtin.package:
    name: tailscale
    state: present
  become: true
  when: is_arch

- name: Install Tailscale on Ubuntu and Fedora
  ansible.builtin.shell: |
    curl -fsSL https://tailscale.com/install.sh -o /tmp/tailscale_install.sh
    sh /tmp/tailscale_install.sh
  args:
    creates: /usr/bin/tailscale
  become: true
  when: is_debian or is_redhat

- name: Install Tailscale app on macOS
  community.general.homebrew_cask:
    name: tailscale-app
    state: present
    update_homebrew: false
  environment: "{{ brew_environment }}"
  when: is_macos

- name: Enable tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: started
  become: true
  when: is_linux

- name: Start and authenticate Tailscale
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--auth-key={{ tailscale_auth_key }}"
  become: true
  no_log: true
  when:
    - is_linux
    - tailscale_auth_key is defined
    - tailscale_auth_key | length > 0

- name: Configure Tailscale options
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - --ssh
      - "--operator={{ user }}"
  become: true
  changed_when: false
  when: is_linux
#
#
# Subnet router note: Using --accept-routes DOES NOT WORK when on the same network as the subnet router WHEN that subnet router is off. Turn on/off with tailscale set --accept-routes=[true|false]
#
# To turn exit node on, do
#   tailscale set --exit-node=[name]
# To turn off, do
#   tailscale set --exit-node=
