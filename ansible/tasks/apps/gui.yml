- name: Install native GUI packages
  vars:
    pkgs:
      Archlinux:
        - audacity
        - decibels
        - papers
        - loupe
        - showtime
        - libreoffice-fresh
        - kdenlive
        - kid3
        - gnome-disk-utility
        - resources
        - evince
        - bluetui
        - wiremix
        - satty
        - obsidian
      Debian:
        - audacity
        - loupe
        - libreoffice
        - kdenlive
        - kid3
        - gnome-disk-utility
        - evince
        - satty
      RedHat:
        - audacity
        - decibels
        - papers
        - loupe
        - showtime
        - libreoffice
        - kdenlive
        - kid3
        - gnome-disk-utility
        - evince
        - satty
  ansible.builtin.package:
    name: "{{ pkgs[ansible_facts['os_family']] }}"
    state: present
  become: true
  when: ansible_facts['os_family'] in pkgs

- name: Install GUI Flatpaks
  vars:
    common_pkgs:
      - org.nickvision.tubeconverter
      - com.github.PintaProject.Pinta
      - org.onlyoffice.desktopeditors
    pkgs:
      Archlinux: []
      Debian:
        - md.obsidian.Obsidian
      RedHat:
        - md.obsidian.Obsidian
  community.general.flatpak:
    name: "{{ common_pkgs + pkgs[ansible_facts['os_family']] }}"
    remote: flathub
    method: system
    state: present
  become: true
  when:
    - is_linux
    - ansible_facts['os_family'] in pkgs

- name: Install OnlyOffice on macOS
  community.general.homebrew_cask:
    name: onlyoffice
    state: present
    update_homebrew: false
  when: is_macos

- name: Install and configure Nautilus
  when: is_linux
  vars:
    pkgs:
      Archlinux:
        - nautilus
        - nautilus-python
        - gvfs-smb
        - gvfs-dnssd
        - gvfs-mtp
        - sushi
      Debian:
        - nautilus
        - python3-nautilus
        - gvfs-backends
        - gnome-sushi
      RedHat:
        - nautilus
        - nautilus-python
        - gvfs-smb
        - gvfs-mtp
        - sushi
  block:
    - name: Install Nautilus
      ansible.builtin.package:
        name: "{{ pkgs[ansible_facts['os_family']] }}"
        state: present
      become: true

    - name: Configure Nautilus captions
      ansible.builtin.command: gsettings set org.gnome.nautilus.icon-view captions "['size', 'none', 'none']"
      changed_when: false

    - name: Configure GTK file chooser sorting
      ansible.builtin.command: gsettings set org.gtk.gtk4.Settings.FileChooser sort-directories-first true
      changed_when: false
      when: is_linux

- name: Hide junk applications from launchers
  vars:
    hidden_apps:
      - limine-snapper-restore
      - avahi-discover
      - bssh
      - btop
      - bvnc
      - cmake-gui
      - fcitx5-configtool
      - fcitx5-wayland-launcher
      - java-java-openjdk
      - jconsole-java-openjdk
      - jshell-java-openjdk
      - lstopo
      - org.fcitx.fcitx5-config-qt
      - org.fcitx.fcitx5-migrator
      - org.fcitx.fcitx5-qt5-gui-wrapper
      - org.fcitx.fcitx5-qt6-gui-wrapper
      - org.fcitx.Fcitx5
      - qv4l2
      - qvidcap
      - remote-viewer
      - uuctl
      - xdvi
      - xgps
      - xgpsspeed
      - yazi
  block:
    - name: Ensure local applications directory exists
      ansible.builtin.file:
        path: "{{ home }}/.local/share/applications"
        state: directory
        mode: "0755"

    - name: Create hidden application entries
      ansible.builtin.copy:
        dest: "{{ home }}/.local/share/applications/{{ item }}.desktop"
        mode: "0644"
        content: |
          [Desktop Entry]
          Type=Application
          Name={{ item }}
          NoDisplay=true
      loop: "{{ hidden_apps }}"
