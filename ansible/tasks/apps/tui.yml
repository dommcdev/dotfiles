- name: Install configured TUI packages
  vars:
    pkgs:
      Archlinux:
        - bat
        - btop
        - fastfetch
        - libqalculate
        - cava
        - starship
      Debian:
        - qalc
        - cava
      RedHat:
        - libqalculate
        - cava
    brew_pkgs:
      - bat
      - btop
      - fastfetch
      - starship
    macos_brew_pkgs:
      - bat
      - btop
      - fastfetch
      - libqalculate
      - cava
      - starship
  block:
    - name: Install native TUI packages
      ansible.builtin.package:
        name: "{{ pkgs[ansible_facts['os_family']] }}"
        state: present
      become: true
      when: ansible_facts['os_family'] in pkgs

    - name: Install configured TUI Homebrew packages on Linux
      community.general.homebrew:
        name: "{{ brew_pkgs }}"
        state: present
        update_homebrew: false
      environment: "{{ brew_environment }}"
      when: is_debian or is_redhat

    - name: Install configured TUI Homebrew packages on macOS
      community.general.homebrew:
        name: "{{ macos_brew_pkgs }}"
        state: present
        update_homebrew: false
      environment: "{{ brew_environment }}"
      when: is_macos

- name: Link TUI config directories
  ansible.builtin.file:
    src: "{{ root }}/{{ item.src }}"
    dest: "{{ home }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: tui/bat
      dest: .config/bat
    - src: tui/btop
      dest: .config/btop

- name: Link Starship config
  ansible.builtin.file:
    src: "{{ root }}/starship/starship.toml"
    dest: "{{ home }}/.config/starship.toml"
    state: link
    force: true

- name: Configure TUI applications
  block:
    - name: Create application config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ home }}/.config/qalculate"
        - "{{ home }}/.config/cava"
        - "{{ home }}/.config/fastfetch"

    - name: Link qalculate config
      ansible.builtin.file:
        src: "{{ root }}/tui/qalc/qalc.cfg"
        dest: "{{ home }}/.config/qalculate/qalc.cfg"
        state: link
        force: true

    - name: Link cava config
      ansible.builtin.file:
        src: "{{ root }}/tui/cava/config"
        dest: "{{ home }}/.config/cava/config"
        state: link
        force: true

    - name: Link fastfetch configs
      ansible.builtin.file:
        src: "{{ item }}"
        dest: "{{ home }}/.config/fastfetch/{{ item | basename }}"
        state: link
        force: true
      loop: "{{ query('ansible.builtin.fileglob', root + '/tui/fastfetch/*.jsonc') }}"

- name: Build bat cache
  ansible.builtin.command: bat cache --build
  changed_when: false
# Note, in the end make sure this includes impala (wlctl), bluetui, wiremix, and cava.
# All but cava should use is_managed_desktop; cava should use not is_headless.
