- name: Install virtualization packages
  ansible.builtin.package:
    name: "{{ pkgs[ansible_facts['os_family']] }}"
    state: present
  become: true
  when: ansible_facts['os_family'] in pkgs
  vars:
    pkgs:
      Archlinux:
        - dnsmasq
        - libvirt
        - qemu-full
        - virt-manager
        - virt-viewer
      Debian:
        - dnsmasq-base
        - libvirt-clients
        - libvirt-daemon-config-network
        - libvirt-daemon-system
        - qemu-system-x86
        - virt-manager
        - virt-viewer
      RedHat:
        - dnsmasq
        - libvirt-client
        - libvirt-daemon-config-network
        - libvirt-daemon-kvm
        - qemu-kvm
        - virt-install
        - virt-manager
        - virt-viewer

- name: Configure virtualization
  become: true
  when: is_linux
  block:
    - name: Enable libvirtd
      ansible.builtin.systemd_service:
        name: libvirtd.service
        enabled: true
        state: started

    - name: Add user to libvirt group
      ansible.builtin.user:
        name: "{{ user }}"
        groups: libvirt
        append: true

    - name: Autostart libvirt default network
      ansible.builtin.command: virsh net-autostart default
      changed_when: false
      failed_when: false
