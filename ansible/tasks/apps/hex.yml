# Use a non-Bluetooth OS microphone input; earbuds can still handle playback.
# With Bluetooth mic input, Hex's Microphone mode setting behaves as follows:
# - Release when idle: switches to low-quality hands-free mode, delaying recording
#   and potentially interrupting playback.
# - Keep ready: keeps hands-free mode active or can stall high-fidelity playback.
- name: Install and configure Hex
  when: is_arch
  block:
    - name: Install Hex
      community.general.pacman:
        name: hex-bin
        state: present
      become: true

    - name: Create data directory
      ansible.builtin.file:
        path: "{{ home }}/.local/share/hex"
        state: directory
        mode: "0755"

    - name: Link settings
      ansible.builtin.file:
        src: "{{ root }}/apps/hex/settings.json"
        dest: "{{ home }}/.local/share/hex/settings.json"
        state: link
        force: true
