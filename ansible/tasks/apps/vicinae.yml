- name: Configure Vicinae
  when: is_arch and is_managed_desktop
  block:
    - name: Create config directory
      ansible.builtin.file:
        path: "{{ home }}/.config/vicinae"
        state: directory
        mode: "0755"

    - name: Link settings
      ansible.builtin.file:
        src: "{{ root }}/vicinae/settings.json"
        dest: "{{ home }}/.config/vicinae/settings.json"
        state: link
        force: true

    - name: Link power helper
      ansible.builtin.file:
        src: "{{ root }}/vicinae/vicinae-power.sh"
        dest: "{{ home }}/.local/bin/vicinae-power.sh"
        state: link
        force: true

    - name: Install Vicinae
      kewlfft.aur.aur:
        name: vicinae-bin
        state: present

    - name: Enable Vicinae user service
      ansible.builtin.systemd_service:
        name: vicinae.service
        enabled: true
        scope: user

    - name: Restart Vicinae if available
      ansible.builtin.systemd_service:
        name: vicinae.service
        state: restarted
        scope: user
      failed_when: false
