- name: Install terminal packages
  vars:
    arch_pkgs:
      - ouch
      - 7zip
      - unarchiver
      - unrar
      - github-cli
      - wget
      - curl
      - ffmpeg
      - fd
      - ripgrep
      - poppler
      - zoxide
      - imagemagick
      - chafa
      - resvg
      - ncdu
      - fzf
      - trash-cli
      - tldr
      - whois
      - eza
      - jq
      - less
      - yt-dlp
      - gum
      - git-delta
      - difftastic
      - nmap
      - bind
      - id3v2
      - lazygit
      - acpi
      - caligula
      - dust
      - glow
      - playerctl
      - duf
      - figlet
      - man-db
      - man-pages
      - bat
      - btop
      - fastfetch
      - bc
      - libqalculate
    apt_pkgs:
      - 7zip
      - unar
      - unrar
      - gh
      - trash-cli
      - wget
      - ffmpeg
      - fd-find
      - ripgrep
      - poppler-utils
      - zoxide
      - imagemagick
      - ghostscript
      - chafa
      - ncdu
      - eza
      - jq
      - less
      - git-delta
      - nmap
      - bind9-dnsutils
      - id3v2
      - playerctl
      - duf
      - figlet
      - bc
      - qalc
    dnf_pckgs:
      - 7zip
      - unar
      - unrar
      - gh
      - trash-cli
      - wget
      - ffmpeg
      - fd-find
      - ripgrep
      - poppler-utils
      - zoxide
      - ImageMagick
      - ghostscript
      - chafa
      - ncdu
      - jq
      - less
      - git-delta
      - nmap
      - bind-utils
      - id3v2
      - playerctl
      - duf
      - figlet
      - bc
      - libqalculate
    brew_pkgs:
      - fzf
      - yt-dlp
      - tlrc
      - resvg
      - gum
      - ouch
      - dust
      - glow
      - difftastic
      - bat
      - btop
      - fastfetch
      - caligula
    macos_brew_pkgs:
      - ouch
      - 7zip
      - unar
      - ffmpeg
      - wget
      - fd
      - ripgrep
      - poppler
      - zoxide
      - imagemagick
      - ghostscript
      - chafa
      - resvg
      - ncdu
      - fzf
      - tlrc
      - eza
      - jq
      - less
      - yt-dlp
      - gum
      - git-delta
      - nmap
      - bind
      - id3v2
      - dust
      - glow
      - duf
      - figlet
      - difftastic
      - bat
      - btop
      - fastfetch
      - bc
      - libqalculate
      - caligula
  block:
    - name: Install terminal packages on Arch
      ansible.builtin.package:
        name: "{{ arch_pkgs }}"
        state: present
      become: true
      when: is_arch

    - name: Install terminal packages on Ubuntu
      ansible.builtin.apt:
        name: "{{ apt_pkgs }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true
      when: is_ubuntu

    - name: Install terminal packages on Fedora
      ansible.builtin.dnf:
        name: "{{ dnf_pckgs }}"
        state: present
      become: true
      when: is_fedora

    - name: Install terminal Homebrew packages on Linux
      ansible.builtin.command: "brew install {{ item }}"
      environment: "{{ brew_environment }}"
      changed_when: false
      loop: "{{ brew_pkgs }}"
      when: (is_ubuntu or is_fedora)

    - name: Install terminal Homebrew packages on macOS
      ansible.builtin.command: "brew install {{ item }}"
      environment: "{{ brew_environment }}"
      changed_when: false
      loop: "{{ macos_brew_pkgs }}"
      when: is_macos

- name: Link terminal config directories
  ansible.builtin.file:
    src: "{{ root }}/{{ item.src }}"
    dest: "{{ home }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: tui/bat
      dest: .config/bat
    - src: tui/btop
      dest: .config/btop

- name: Create qalculate config directory
  ansible.builtin.file:
    path: "{{ home }}/.config/qalculate"
    state: directory
    mode: "0755"

- name: Link qalculate config
  ansible.builtin.file:
    src: "{{ root }}/tui/qalc/qalc.cfg"
    dest: "{{ home }}/.config/qalculate/qalc.cfg"
    state: link
    force: true

- name: Create cava config directory
  ansible.builtin.file:
    path: "{{ home }}/.config/cava"
    state: directory
    mode: "0755"

- name: Link cava config
  ansible.builtin.file:
    src: "{{ root }}/tui/cava/config"
    dest: "{{ home }}/.config/cava/config"
    state: link
    force: true

- name: Create fastfetch config directory
  ansible.builtin.file:
    path: "{{ home }}/.config/fastfetch"
    state: directory
    mode: "0755"

- name: Link fastfetch configs
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ home }}/.config/fastfetch/{{ item | basename }}"
    state: link
    force: true
  loop: "{{ lookup('ansible.builtin.fileglob', root + '/tui/fastfetch/*.jsonc', wantlist=True) }}"

- name: Build bat cache
  ansible.builtin.command: bat cache --build
  changed_when: false
