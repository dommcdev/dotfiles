- name: Ensure Karabiner config directory exists
  ansible.builtin.file:
    path: "{{ home }}/.config/karabiner"
    state: directory
    mode: "0755"

- name: Link Karabiner config
  ansible.builtin.file:
    src: "{{ root }}/mac/karabiner/karabiner.json"
    dest: "{{ home }}/.config/karabiner/karabiner.json"
    state: link
    force: true

- name: Ensure Rectangle config directory exists
  ansible.builtin.file:
    path: "{{ home }}/Library/Application Support/Rectangle"
    state: directory
    mode: "0755"

- name: Link Rectangle config
  ansible.builtin.file:
    src: "{{ root }}/mac/rectangle/RectangleConfig.json"
    dest: "{{ home }}/Library/Application Support/Rectangle/RectangleConfig.json"
    state: link
    force: true

- name: Install macOS-only GUI utilities
  community.general.homebrew_cask:
    name:
      - karabiner-elements
      - raycast
      - rectangle
    state: present
    update_homebrew: false
  environment: "{{ brew_environment }}"

- name: Apply macOS defaults
  ansible.builtin.shell: |
    defaults write com.apple.finder NSUserKeyEquivalents -dict-add "Close Window" "@q"
    defaults write com.google.Chrome NSUserKeyEquivalents -dict-add "Close Window" "@~^\$c"
    defaults import com.apple.symbolichotkeys "{{ root }}/mac/misc/symbolichotkeys.plist"
    defaults write com.apple.dock persistent-apps -array
    defaults write com.apple.dock show-recents -bool false
    defaults write com.apple.dock persistent-others -array
    defaults write com.apple.dock minimize-to-application -bool false
    defaults write com.apple.dock autohide -bool true
    defaults write com.apple.dock tilesize -int 1
    defaults write com.apple.dock autohide-delay -float 1000
    defaults write com.apple.dock no-bouncing -bool true
    defaults write com.apple.dock wvous-tl-corner -int 5
    defaults write com.apple.dock wvous-tl-modifier -int 0
    defaults write -g com.apple.swipescrolldirection -bool false
    defaults write com.apple.AppleMultitouchTrackpad Clicking -int 1
    defaults -currentHost write com.apple.screensaver idleTime -int 300
    sudo pmset displaysleep 10
    sudo pmset -b lessbright 0
    defaults -currentHost write com.apple.screensaver showClock -bool true
    sudo defaults write /Library/Preferences/com.apple.loginwindow UsesLargeDateTime -bool true
    defaults write com.apple.finder ShowPathbar -bool true
    defaults write com.apple.finder ShowStatusBar -bool true
    defaults write com.apple.finder FXRemoveOldTrashItems -bool true
    defaults write NSGlobalDomain AppleShowAllExtensions -bool true
    defaults write com.apple.finder NewWindowTargetPath -string "PfHm"
    defaults write com.apple.finder FXEnableExtensionChangeWarning -bool false
    defaults write com.apple.finder ShowRecentTags -bool false
    chflags hidden /Users/$USER/Pictures /Users/$USER/Documents /Users/$USER/Music /Users/$USER/Movies /Users/$USER/Desktop /Users/$USER/Public || true
    defaults write com.apple.finder FXPreferredViewStyle -string "icnv"
    /usr/libexec/PlistBuddy -c "Set :StandardViewSettings:IconViewSettings:arrangeBy name" ~/Library/Preferences/com.apple.finder.plist
    defaults write com.apple.finder _FXSortFoldersFirst -bool true
    defaults write ~/Library/Preferences/ByHost/com.apple.controlcenter.plist Bluetooth -int 18
    defaults write NSGlobalDomain NSDocumentSaveNewDocumentsToCloud -bool false
    defaults write NSGlobalDomain KeyRepeat -int 2
    defaults write com.apple.dock mru-spaces -bool false
    defaults write com.apple.desktopservices DSDontWriteNetworkStores -bool true
    defaults write com.apple.desktopservices DSDontWriteUSBStores -bool true
    defaults write com.apple.Spotlight MenuItemHidden -bool true
    mkdir -p ~/Downloads/Screenshots
    defaults write com.apple.screencapture location ~/Downloads/Screenshots
    defaults -currentHost write com.apple.controlcenter.plist BatteryShowPercentage -bool true
    touch ~/.hushlogin
    sudo scutil --set ComputerName "applepie"
    sudo scutil --set HostName "applepie"
    sudo scutil --set LocalHostName "applepie"
    killall Dock || true
    killall SystemUIServer || true
    killall NotificationCenter || true
  changed_when: false
