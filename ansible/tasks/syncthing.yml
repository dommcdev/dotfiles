- name: Install Syncthing on Arch
  ansible.builtin.package:
    name: syncthing
    state: present
  become: true
  when: is_arch

- name: Install Syncthing on Ubuntu
  ansible.builtin.apt:
    name: syncthing
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: is_ubuntu

- name: Install Syncthing on Fedora
  ansible.builtin.dnf:
    name: syncthing
    state: present
  become: true
  when: is_fedora

- name: Install Syncthing with Homebrew
  community.general.homebrew:
    name: syncthing
    state: present
    update_homebrew: false
  environment: "{{ brew_environment }}"
  when: is_macos

- name: Enable Syncthing user service
  ansible.builtin.systemd_service:
    name: syncthing.service
    enabled: true
    state: started
    scope: user
  when: is_linux
