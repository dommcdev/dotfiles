# Should roughly mirror https://github.com/CachyOS/cachyos-repo-add-script
# Minus the system update part, as this can cause issues with an initial ansible run.

- name: Import the CachyOS repository signing key
  ansible.builtin.command:
    argv:
      - pacman-key
      - --recv-keys
      - 882DCFE48E2051D48E2562ABF3B607488DB35A47
      - --keyserver
      - keyserver.ubuntu.com
  changed_when: false

- name: Locally sign the CachyOS repository signing key
  ansible.builtin.command:
    argv:
      - pacman-key
      - --lsign-key
      - 882DCFE48E2051D48E2562ABF3B607488DB35A47
  changed_when: false

- name: Check for x86-64-v3 support
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -o
      - pipefail
      - -c
      - /lib/ld-linux-x86-64.so.2 --help | grep -F 'x86-64-v3 (supported, searched)'
  register: cachyos_x86_64_v3
  changed_when: false
  failed_when: false

- name: Check for x86-64-v4 support
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -o
      - pipefail
      - -c
      - /lib/ld-linux-x86-64.so.2 --help | grep -F 'x86-64-v4 (supported, searched)'
  register: cachyos_x86_64_v4
  changed_when: false
  failed_when: false

- name: Check for Zen 4 or Zen 5
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -o
      - pipefail
      - -c
      - gcc -march=native -Q --help=target 2>&1 | grep -E 'march.*(znver4|znver5)'
  register: cachyos_znver4
  changed_when: false
  failed_when: false

- name: Require x86-64-v3 support
  ansible.builtin.assert:
    that: cachyos_x86_64_v3.rc == 0
    fail_msg: CachyOS optimized repositories require an x86-64-v3 capable CPU

- name: Select the optimized CachyOS repositories
  ansible.builtin.set_fact:
    cachyos_repo_variant: >-
      {{ 'znver4' if cachyos_znver4.rc == 0 else
         'v4' if cachyos_x86_64_v4.rc == 0 else
         'v3' }}
    cachyos_optimized_mirrorlist: >-
      {{ '/etc/pacman.d/cachyos-v4-mirrorlist'
         if cachyos_znver4.rc == 0 or cachyos_x86_64_v4.rc == 0
         else '/etc/pacman.d/cachyos-v3-mirrorlist' }}
    cachyos_optimized_mirrorlist_package: >-
      {{ 'cachyos-v4-mirrorlist'
         if cachyos_znver4.rc == 0 or cachyos_x86_64_v4.rc == 0
         else 'cachyos-v3-mirrorlist' }}

- name: Back up pacman configuration
  ansible.builtin.copy:
    src: /etc/pacman.conf
    dest: /etc/pacman.conf.bak
    remote_src: true
    force: false
    mode: preserve

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: pacman

- name: Configure the direct CachyOS bootstrap repository
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    insertbefore: '^\[core\]$'
    marker: "# {mark} ANSIBLE MANAGED CACHYOS REPOSITORIES"
    block: |
      [cachyos]
      Server = https://mirror.cachyos.org/repo/$arch/cachyos
  when: >-
    'cachyos-keyring' not in ansible_facts.packages or
    'cachyos-mirrorlist' not in ansible_facts.packages or
    cachyos_optimized_mirrorlist_package not in ansible_facts.packages

- name: Refresh package databases with the CachyOS bootstrap repository
  community.general.pacman:
    update_cache: true
  when: >-
    'cachyos-keyring' not in ansible_facts.packages or
    'cachyos-mirrorlist' not in ansible_facts.packages or
    cachyos_optimized_mirrorlist_package not in ansible_facts.packages

- name: Install CachyOS repository metadata
  community.general.pacman:
    name:
      - cachyos-keyring
      - cachyos-mirrorlist
      - "{{ cachyos_optimized_mirrorlist_package }}"
    state: latest

- name: Configure supported package architectures
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^Architecture\s*='
    line: >-
      Architecture = {{ 'x86_64 x86_64_v3 x86_64_v4'
                        if cachyos_repo_variant in ['v4', 'znver4']
                        else 'x86_64 x86_64_v3' }}

- name: Configure optimized CachyOS repositories
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    insertbefore: '^\[core\]$'
    marker: "# {mark} ANSIBLE MANAGED CACHYOS REPOSITORIES"
    block: |
      [cachyos-{{ cachyos_repo_variant }}]
      Include = {{ cachyos_optimized_mirrorlist }}

      [cachyos-core-{{ cachyos_repo_variant }}]
      Include = {{ cachyos_optimized_mirrorlist }}

      [cachyos-extra-{{ cachyos_repo_variant }}]
      Include = {{ cachyos_optimized_mirrorlist }}

      [cachyos]
      Include = /etc/pacman.d/cachyos-mirrorlist
