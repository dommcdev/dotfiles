- name: Install SSH packages on Arch
  ansible.builtin.package:
    name:
      - openssh
      - mosh
    state: present
  become: true
  when: is_arch

- name: Install SSH packages on Ubuntu
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: is_ubuntu

- name: Install SSH packages on Fedora
  ansible.builtin.dnf:
    name:
      - openssh-server
      - mosh
    state: present
  become: true
  when: is_fedora

- name: Install OpenSSH with Homebrew
  ansible.builtin.command: brew install openssh
  environment: "{{ brew_environment }}"
  changed_when: false
  when: is_macos

- name: Ensure SSH config directory exists
  ansible.builtin.file:
    path: "{{ home }}/.ssh"
    state: directory
    mode: "0700"

- name: Link SSH config
  ansible.builtin.file:
    src: "{{ root }}/ssh/config"
    dest: "{{ home }}/.ssh/config"
    state: link
    force: true

- name: Enable SSH daemon on Arch and Fedora
  ansible.builtin.systemd_service:
    name: sshd.service
    enabled: true
  become: true
  when: is_arch or is_fedora

- name: Enable SSH daemon on Ubuntu
  ansible.builtin.systemd_service:
    name: ssh.service
    enabled: true
  become: true
  when: is_ubuntu

- name: Enable TCP MTU probing
  ansible.builtin.lineinfile:
    path: /etc/sysctl.d/99-sysctl.conf
    line: net.ipv4.tcp_mtu_probing=1
    create: true
    mode: "0644"
  become: true
  when: is_linux

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication .*$"
    line: "PasswordAuthentication no"
  become: true
  when: is_linux

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin .*$"
    line: "PermitRootLogin no"
  become: true
  when: is_linux

- name: Restart SSH services
  ansible.builtin.shell: |
    systemctl daemon-reload
    systemctl restart ssh.socket 2>/dev/null || systemctl restart sshd.socket 2>/dev/null || true
    systemctl restart ssh 2>/dev/null || systemctl restart sshd
  become: true
  changed_when: false
  when: is_linux
