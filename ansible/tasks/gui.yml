- name: Install GUI packages
  vars:
    arch_pkgs:
      - audacity
      - decibels
      - papers
      - loupe
      - showtime
      - libreoffice-fresh
      - blender
      - kdenlive
      - gnome-disk-utility
      - gimp
      - resources
      - evince
      - celluloid
      - bluetui
      - wiremix
      - gnuplot
      - nautilus
      - nautilus-python
      - gvfs-smb
      - gvfs-dnssd
      - gvfs-mtp
      - sushi
      - udiskie
    gui_flatpaks:
      - org.nickvision.tubeconverter
      - com.github.PintaProject.Pinta
      - org.onlyoffice.desktopeditors
  block:
    - name: Install GUI packages on Arch
      ansible.builtin.package:
        name: "{{ arch_pkgs }}"
        state: present
      become: true
      when: is_arch

    - name: Install GUI Flatpaks
      ansible.builtin.command: "flatpak install --assumeyes --noninteractive flathub {{ item }}"
      changed_when: false
      loop: "{{ gui_flatpaks }}"
      when: is_linux

- name: Create screenshot and video directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ home }}/Downloads/Screenshots"
    - "{{ home }}/Downloads/Videos"

- name: Ensure GUI config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ home }}/.config/GIMP/3.2"
    - "{{ home }}/.local/share/applications"
    - "{{ home }}/.local/share/icons/hicolor/scalable/apps"

- name: Install Chrome on Linux
  ansible.builtin.command: yay -S --noconfirm --needed --answerdiff None --answerclean None google-chrome
  changed_when: false
  when: is_arch

- name: Install Chrome and OnlyOffice on macOS
  community.general.homebrew_cask:
    name:
      - google-chrome
      - onlyoffice
    state: present
    update_homebrew: false
  environment: "{{ brew_environment }}"
  when: is_macos

- name: Link GIMP config files
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ home }}/.config/GIMP/3.2/{{ item | basename }}"
    state: link
    force: true
  loop: "{{ lookup('ansible.builtin.fileglob', root + '/apps/gimp/*', wantlist=True) }}"

- name: Link Chrome flags on Linux
  ansible.builtin.file:
    src: "{{ root }}/apps/chrome/chrome-flags.conf"
    dest: "{{ home }}/.config/chrome-flags.conf"
    state: link
    force: true
  when: is_linux

- name: Ensure OnlyOffice config directory exists
  ansible.builtin.file:
    path: "{{ home }}/.config/onlyoffice"
    state: directory
    mode: "0755"

- name: Link OnlyOffice theme
  ansible.builtin.file:
    src: "{{ root }}/apps/onlyoffice/theme.json"
    dest: "{{ home }}/.config/onlyoffice/theme.json"
    state: link
    force: true

- name: Link desktop files
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ home }}/.local/share/applications/{{ item | basename }}"
    state: link
    force: true
  loop: "{{ lookup('ansible.builtin.fileglob', root + '/apps/desktop-files/misc-apps/*', wantlist=True) + lookup('ansible.builtin.fileglob', root + '/apps/desktop-files/hidden/*', wantlist=True) }}"
  when: is_linux

- name: Link desktop file icons
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ home }}/.local/share/icons/hicolor/scalable/apps/{{ item | basename }}"
    state: link
    force: true
  loop: "{{ lookup('ansible.builtin.fileglob', root + '/apps/desktop-files/icons/*', wantlist=True) }}"
  when: is_linux

- name: Update local icon and desktop caches
  ansible.builtin.shell: |
    gtk-update-icon-cache -f -t "{{ home }}/.local/share/icons/hicolor"
    update-desktop-database "{{ home }}/.local/share/applications"
  changed_when: false
  when: is_linux

- name: Configure Nautilus captions
  ansible.builtin.command: gsettings set org.gnome.nautilus.icon-view captions "['size', 'none', 'none']"
  changed_when: false
  when: is_linux

- name: Configure GTK file chooser sorting
  ansible.builtin.command: gsettings set org.gtk.gtk4.Settings.FileChooser sort-directories-first true
  changed_when: false
  when: is_linux

- name: Install desktop development packages on Arch
  ansible.builtin.package:
    name:
      - jdk-openjdk
      - clang
      - python
      - python-pip
      - deno
      - uv
    state: present
  become: true
  when: is_arch

- name: Install desktop development packages with Homebrew
  community.general.homebrew:
    name:
      - java
      - llvm
      - python
      - typst
      - deno
      - uv
    state: present
    update_homebrew: false
  environment: "{{ brew_environment }}"
  when: not is_arch

- name: Install GitHub CLI for repo setup on Arch
  ansible.builtin.package:
    name: github-cli
    state: present
  become: true
  when: is_arch

- name: Install GitHub CLI for repo setup with Homebrew
  community.general.homebrew:
    name: gh
    state: present
    update_homebrew: false
  environment: "{{ brew_environment }}"
  when: not is_arch

- name: Ensure dev directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ home }}/dev/projects"
    - "{{ home }}/dev/external"

- name: Install gh markdown preview extension
  ansible.builtin.command: gh extension install yusukebe/gh-markdown-preview
  changed_when: false
  failed_when: false

- name: Use SSH remote for dotfiles repo
  ansible.builtin.command: git remote set-url origin git@github.com:dommcdev/dotfiles.git
  args:
    chdir: "{{ home }}/dev/dotfiles"
  changed_when: false
  failed_when: false

- name: Use SSH remote for wallpapers repo
  ansible.builtin.command: git remote set-url origin git@github.com:dommcdev/wallpapers.git
  args:
    chdir: "{{ home }}/dev/wallpapers"
  changed_when: false
  failed_when: false

- name: Install node on Arch
  ansible.builtin.package:
    name:
      - nodejs
      - npm
    state: present
  become: true
  when: is_arch

- name: Install node with Homebrew
  community.general.homebrew:
    name: nodejs
    state: present
    update_homebrew: false
  environment: "{{ brew_environment }}"
  when: not is_arch

- name: Configure npm global prefix
  ansible.builtin.shell: |
    mkdir -p "{{ home }}/.local/share/npm-global"
    npm config set prefix '~/.local/share/npm-global'
  changed_when: false

- name: Install Rust for beancount tools on Arch
  ansible.builtin.package:
    name: rust
    state: present
  become: true
  when: is_arch

- name: Install beancount AUR tools on Arch
  ansible.builtin.command: yay -S --noconfirm --needed --answerdiff None --answerclean None beancount fava
  changed_when: false
  when: is_arch

- name: Install beancount tools with Homebrew
  community.general.homebrew:
    name:
      - beancount
      - fava
      - rust
    state: present
    update_homebrew: false
  environment: "{{ brew_environment }}"
  when: not is_arch

- name: Clone beans repo
  ansible.builtin.command: gh repo clone dommcdev/beans "{{ home }}/dev/beans"
  args:
    creates: "{{ home }}/dev/beans"
