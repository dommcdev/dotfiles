# Note, the order-of-operations is very intentional for the tasks in this file.
- name: Refresh apt package cache
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: is_ubuntu

- name: Refresh pacman package databases
  community.general.pacman:
    update_cache: true
  become: true
  when: is_arch

- name: Install basic dependencies on Linux
  ansible.builtin.package:
    name: "{{ pkgs[ansible_facts['os_family']] }}"
    state: present
  become: true
  vars:
    pkgs:
      Archlinux:
        - base-devel
        - git
        - python
        - python-pip
      Debian:
        - build-essential
        - curl
        - file
        - gcc
        - git
        - make
        - procps
      RedHat:
        - curl
        - dnf-plugins-core
        - file
        - gcc
        - gcc-c++
        - git
        - make
        - procps-ng
  when: ansible_facts['os_family'] in pkgs

- name: Configure Ubuntu package repositories
  when: is_ubuntu
  block:
    - name: Install Ubuntu repository management tools
      ansible.builtin.package:
        name: software-properties-common
        state: present
      become: true

    - name: Enable Ubuntu Multiverse repository
      ansible.builtin.command: add-apt-repository --yes multiverse
      become: true
      changed_when: false

- name: Configure Fedora package repositories
  become: true
  when: is_fedora
  block:
    - name: Enable RPM Fusion repositories
      ansible.builtin.dnf:
        name:
          - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
          - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
        state: present
        disable_gpg_check: true

- name: Install Homebrew
  when: is_ubuntu or is_fedora or is_macos
  block:
    - name: Check if homebrew is installed.
      ansible.builtin.command: brew --version
      register: prerequisites_brew
      changed_when: false
      failed_when: false
      environment:
        PATH: "/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"

    - name: Run installer
      ansible.builtin.shell: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      environment:
        NONINTERACTIVE: "1"
      changed_when: true
      when: prerequisites_brew.rc != 0

- name: Install basic dependencies on macOS via Homebrew
  community.general.homebrew:
    name:
      - gcc
      - git
      - make
      - python
    state: present
    update_homebrew: false
  when: is_macos

- name: Install basic depencencies with Linuxbrew
  community.general.homebrew:
    name: python
    state: present
    update_homebrew: false
  when: is_ubuntu or is_fedora

- name: Install Bun
  block:
    - name: Install Bun on Arch
      ansible.builtin.package:
        name: bun
        state: present
      become: true
      when: is_arch

    - name: Install Bun via Homebrew
      community.general.homebrew:
        name: oven-sh/bun/bun
        state: present
        update_homebrew: false
      when: is_ubuntu or is_fedora or is_macos

- name: Configure Bun
  block:
    - name: Create config directory
      ansible.builtin.file:
        path: "{{ home }}/.config"
        state: directory
        mode: "0755"

    - name: Configure global install paths
      ansible.builtin.copy:
        dest: "{{ home }}/.config/.bunfig.toml"
        mode: "0644"
        content: |
          [install]
          globalDir = "{{ home }}/.local/share/bun/install/global"
          globalBinDir = "{{ home }}/.local/share/bun/bin"

          [install.cache]
          dir = "{{ home }}/.cache/bun"

- name: Configure Arch package management
  become: true
  when: is_arch
  block:
    - name: List configured pacman repositories
      ansible.builtin.command: pacman-conf --repo-list
      register: pacman_repositories
      changed_when: false

    - name: Add CachyOS repositories
      when: "'cachyos' not in pacman_repositories.stdout"
      block:
        - name: Download CachyOS repository installer
          ansible.builtin.get_url:
            url: https://mirror.cachyos.org/cachyos-repo.tar.xz
            dest: /tmp/cachyos-repo.tar.xz
            mode: "0644"

        - name: Extract CachyOS repository installer
          ansible.builtin.unarchive:
            src: /tmp/cachyos-repo.tar.xz
            dest: /tmp
            remote_src: true

        - name: Run CachyOS repository installer
          ansible.builtin.command: ./cachyos-repo.sh --install
          args:
            chdir: /tmp/cachyos-repo
            stdin: "y\n"
          changed_when: true

    - name: Configure additional pacman repositories
      community.general.ini_file:
        path: /etc/pacman.conf
        mode: "0644"
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: true
      loop:
        - section: multilib
          option: Include
          value: /etc/pacman.d/mirrorlist
        - section: omarchy
          option: SigLevel
          value: Optional TrustAll
        - section: omarchy
          option: Server
          value: https://pkgs.omarchy.org/stable/$arch

    - name: Refresh configured Arch package databases
      community.general.pacman:
        update_cache: true

    - name: Install Yay
      ansible.builtin.package:
        name: yay
        state: present

    - name: Prepare for the kewlfft aur ansible module
      block:
        - name: Create the `aur_builder` user
          become: true
          ansible.builtin.user:
            name: aur_builder
            create_home: true
            group: wheel

        - name: Allow the `aur_builder` user to run `sudo pacman` without a password
          become: true
          ansible.builtin.lineinfile:
            path: /etc/sudoers.d/11-install-aur_builder
            line: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman"
            create: true
            mode: "0644"
            validate: "visudo -cf %s"

    - name: Configure pacman options
      ansible.builtin.lineinfile:
        path: /etc/pacman.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: '^\[options\]'
      loop:
        - regexp: "^#?Color$"
          line: Color
        - regexp: "^ILoveCandy$"
          line: ILoveCandy
        - regexp: "^#?VerbosePkgLists$"
          line: VerbosePkgLists

- name: Install Flatpak
  when: is_linux
  block:
    - name: Install Flatpak package
      ansible.builtin.package:
        name: flatpak
        state: present
      become: true

    - name: Add flatpak Flathub remote
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
        method: system
        state: present
      become: true

- name: Clone dotfiles
  ansible.builtin.git:
    repo: https://github.com/dommcdev/dotfiles.git
    dest: "{{ root }}"
    version: main
    update: true
