- name: Create Bun config directory
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.config"
    state: directory
    mode: "0755"

- name: Configure Bun global install paths
  ansible.builtin.copy:
    dest: "{{ dotfiles_home }}/.config/.bunfig.toml"
    mode: "0644"
    content: |
      [install]
      globalDir = "{{ dotfiles_home }}/.local/share/bun/install/global"
      globalBinDir = "{{ dotfiles_home }}/.local/share/bun/bin"

      [install.cache]
      dir = "{{ dotfiles_home }}/.cache/bun"

- name: Install Bun on Arch
  ansible.builtin.package:
    name: bun
    state: present
  become: true
  when: dotfiles_is_arch

- name: Install Bun with Homebrew
  ansible.builtin.command: brew install oven-sh/bun/bun
  environment: "{{ brew_environment }}"
  changed_when: false
  when: not dotfiles_is_arch

- name: Install Arch pacman configuration
  become: true
  when: dotfiles_is_arch
  block:
    - name: Copy pacman.conf
      ansible.builtin.copy:
        src: "{{ dotfiles_root }}/arch/pacman/pacman.conf"
        dest: /etc/pacman.conf
        mode: "0644"

    - name: Create pacman hooks directory
      ansible.builtin.file:
        path: /etc/pacman.d/hooks
        state: directory
        mode: "0755"

    - name: Copy adw-gtk3 Flatpak sync hook
      ansible.builtin.copy:
        src: "{{ dotfiles_root }}/arch/pacman/hooks/adw-gtk3-flatpak-sync.hook"
        dest: /etc/pacman.d/hooks/adw-gtk3-flatpak-sync.hook
        mode: "0644"

    - name: Refresh Arch package databases and upgrade
      ansible.builtin.pacman:
        update_cache: true
        upgrade: true

- name: Install Arch AUR helper extras
  ansible.builtin.command: yay -S --noconfirm --needed --answerdiff None --answerclean None downgrade
  changed_when: false
  when: dotfiles_is_arch

- name: Disable Ubuntu MOTD scripts
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0644"
  become: true
  loop: "{{ lookup('ansible.builtin.fileglob', '/etc/update-motd.d/*', wantlist=True) }}"
  when: dotfiles_is_ubuntu

- name: Configure Fedora DNF defaults
  ansible.builtin.blockinfile:
    path: /etc/dnf/dnf.conf
    marker: "# {mark} ANSIBLE DOTFILES DNF DEFAULTS"
    block: |
      max_parallel_downloads=10
      fastestmirror=True
  become: true
  when: dotfiles_is_fedora

- name: Install Linux desktop utility packages on Arch
  ansible.builtin.package:
    name: "{{ linux_desktop_packages_arch }}"
    state: present
  become: true
  when: dotfiles_is_arch and dotfiles_is_desktop

- name: Install Linux desktop utility packages on Ubuntu
  ansible.builtin.apt:
    name: "{{ linux_desktop_packages_apt }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: dotfiles_is_ubuntu and dotfiles_is_desktop

- name: Install Linux desktop utility packages on Fedora
  ansible.builtin.dnf:
    name: "{{ linux_desktop_packages_dnf }}"
    state: present
  become: true
  when: dotfiles_is_fedora and dotfiles_is_desktop

- name: Add Flathub remote
  ansible.builtin.command: flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
  changed_when: false
  when: dotfiles_is_linux and dotfiles_is_desktop

- name: Increase sudo password tries
  ansible.builtin.copy:
    dest: /etc/sudoers.d/passwd-tries
    content: "Defaults passwd_tries=10\n"
    mode: "0440"
    validate: "visudo -cf %s"
  become: true
  when: dotfiles_is_linux and dotfiles_is_desktop

- name: Configure Arch faillock auth precheck
  ansible.builtin.lineinfile:
    path: /etc/pam.d/system-auth
    regexp: "^(auth\\s+required\\s+pam_faillock\\.so)\\s+preauth.*$"
    line: "auth       required                    pam_faillock.so      preauth silent deny=10 unlock_time=120"
    backrefs: false
  become: true
  when: dotfiles_is_arch and dotfiles_is_desktop

- name: Configure Arch faillock auth failure
  ansible.builtin.lineinfile:
    path: /etc/pam.d/system-auth
    regexp: "^(auth\\s+\\[default=die\\]\\s+pam_faillock\\.so)\\s+authfail.*$"
    line: "auth       [default=die]               pam_faillock.so      authfail deny=10 unlock_time=120"
    backrefs: false
  become: true
  when: dotfiles_is_arch and dotfiles_is_desktop

- name: Configure Arch faillock deny limit
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: "^#?\\s*deny\\s*=.*$"
    line: "deny = 10"
  become: true
  when: dotfiles_is_arch and dotfiles_is_desktop

- name: Install power profiles daemon on laptops
  ansible.builtin.package:
    name: power-profiles-daemon
    state: present
  become: true
  when: dotfiles_is_arch and dotfiles_is_laptop

- name: Enable power profiles daemon on laptops
  ansible.builtin.systemd_service:
    name: power-profiles-daemon.service
    enabled: true
  become: true
  when: dotfiles_is_arch and dotfiles_is_laptop

- name: Install custom driver and desktop control packages on Arch
  ansible.builtin.package:
    name:
      - libva-mesa-driver
      - libva-utils
      - mesa
      - vulkan-radeon
      - intel-media-driver
      - sof-firmware
      - gst-plugins-good
      - gst-plugins-bad
      - gst-plugins-ugly
      - gst-plugins-base
      - gst-plugins-base-libs
      - gst-libav
      - vulkan-intel
      - xdg-utils
      - ddcutil
      - wl-clipboard
      - gnome-keyring
      - libsecret
      - wtype
      - reflector
      - brightnessctl
      - acpi
      - fwupd
    state: present
  become: true
  when: dotfiles_is_arch and dotfiles_is_custom

- name: Install desktop control packages on Fedora
  ansible.builtin.dnf:
    name:
      - xdg-utils
      - ddcutil
      - wl-clipboard
      - gnome-keyring
      - libsecret
      - wtype
      - brightnessctl
      - acpi
      - fwupd
    state: present
  become: true
  when: dotfiles_is_fedora and dotfiles_is_custom

- name: Install fun terminal packages on Arch
  ansible.builtin.package:
    name:
      - perl-curses
      - perl-term-animation
      - cowsay
      - ponysay
      - countryfetch
      - lolcat
      - fortune-mod
      - sl
      - espeak-ng
      - toilet
      - nyancat
    state: present
  become: true
  when: dotfiles_is_arch and dotfiles_is_custom

- name: Install cmatrix AUR package
  ansible.builtin.command: yay -S --noconfirm --needed --answerdiff None --answerclean None cmatrix-git
  changed_when: false
  when: dotfiles_is_arch and dotfiles_is_custom

- name: Install lavat
  ansible.builtin.shell: |
    git clone --depth 1 https://github.com/AngelJumbo/lavat.git /tmp/lavat
    make -C /tmp/lavat install
    rm -rf /tmp/lavat
  args:
    creates: /usr/local/bin/lavat
  become: true
  when: dotfiles_is_custom and dotfiles_is_linux

- name: Clone wallpapers
  ansible.builtin.git:
    repo: https://github.com/dommcdev/wallpapers.git
    dest: "{{ dotfiles_home }}/dev/wallpapers"
    update: false
  when: dotfiles_is_desktop

- name: Install GrandOrgue Flatpak
  ansible.builtin.command: flatpak install --assumeyes --noninteractive flathub net.sourceforge.GrandOrgue
  changed_when: false
  when: dotfiles_is_linux and dotfiles_is_desktop

- name: Create GrandOrgue config directory
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.config/GrandOrgue"
    state: directory
    mode: "0755"
  when: dotfiles_is_linux and dotfiles_is_desktop

- name: Configure GrandOrgue Flatpak overrides
  ansible.builtin.command: "flatpak override --user {{ item }} net.sourceforge.GrandOrgue"
  changed_when: false
  loop:
    - "--env=HOME={{ dotfiles_home }}/.config/GrandOrgue"
    - "--env=PIPEWIRE_LATENCY=128/48000"
  when: dotfiles_is_linux and dotfiles_is_desktop

- name: Link screensaver scripts
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ dotfiles_home }}/.local/bin/{{ item | basename }}"
    state: link
    force: true
  loop: "{{ lookup('ansible.builtin.fileglob', dotfiles_root + '/screensaver/scripts/*', wantlist=True) }}"
  when: dotfiles_is_custom

- name: Install screensaver text effects package
  ansible.builtin.command: yay -S --noconfirm --needed --answerdiff None --answerclean None aur/python-terminaltexteffects
  changed_when: false
  when: dotfiles_is_arch and dotfiles_is_custom

- name: Install Timeshift packages
  ansible.builtin.package:
    name:
      - timeshift
      - btrfs-progs
      - xorg-xhost
      - cronie
    state: present
  become: true
  when: dotfiles_is_arch and dotfiles_is_custom

- name: Create Timeshift config directory
  ansible.builtin.file:
    path: /etc/timeshift
    state: directory
    mode: "0755"
  become: true
  when: dotfiles_is_arch and dotfiles_is_custom

- name: Copy Timeshift config
  ansible.builtin.copy:
    src: "{{ dotfiles_root }}/timeshift/timeshift.json"
    dest: /etc/timeshift/timeshift.json
    mode: "0644"
  become: true
  when: dotfiles_is_arch and dotfiles_is_custom

- name: Enable cronie for Timeshift
  ansible.builtin.systemd_service:
    name: cronie.service
    enabled: true
    state: started
  become: true
  when: dotfiles_is_arch and dotfiles_is_custom
