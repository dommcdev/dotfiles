- name: Disable Ubuntu MOTD scripts
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0644"
  become: true
  loop: "{{ lookup('ansible.builtin.fileglob', '/etc/update-motd.d/*', wantlist=True) }}"
  when: is_ubuntu

- name: Configure Fedora DNF defaults
  ansible.builtin.blockinfile:
    path: /etc/dnf/dnf.conf
    marker: "# {mark} ANSIBLE DOTFILES DNF DEFAULTS"
    block: |
      max_parallel_downloads=10
      fastestmirror=True
  become: true
  when: is_fedora

- name: Configure Linux desktop utilities
  when: is_linux and is_managed_desktop
  block:
    - name: Install desktop utility packages
      ansible.builtin.package:
        name: "{{ pkgs[ansible_facts['os_family']] }}"
        state: present
      become: true
      when: ansible_facts['os_family'] in pkgs
      vars:
        pkgs:
          Archlinux:
            - flatpak
            - smartmontools
            - dosfstools
            - ntfs-3g
            - exfatprogs
            - btrfs-progs
            - xfsprogs
            - wev
            - libinput-tools
            - dmidecode
            - downgrade
          Debian:
            - flatpak
            - smartmontools
            - dosfstools
            - ntfs-3g
            - exfatprogs
            - btrfs-progs
            - xfsprogs
            - wev
            - libinput-tools
            - dmidecode
          RedHat:
            - flatpak
            - smartmontools
            - dosfstools
            - ntfs-3g
            - exfatprogs
            - btrfs-progs
            - xfsprogs
            - wev
            - libinput-utils
            - dmidecode

    - name: Add Flathub remote
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
        method: system
        state: present
      become: true

- name: Increase sudo password tries
  ansible.builtin.copy:
    dest: /etc/sudoers.d/passwd-tries
    content: "Defaults passwd_tries=10\n"
    mode: "0440"
    validate: "visudo -cf %s"
  become: true
  when: is_linux and is_managed_desktop

- name: Configure Arch faillock
  become: true
  when: is_arch and is_managed_desktop
  block:
    - name: Configure auth precheck
      ansible.builtin.lineinfile:
        path: /etc/pam.d/system-auth
        regexp: "^(auth\\s+required\\s+pam_faillock\\.so)\\s+preauth.*$"
        line: "auth       required                    pam_faillock.so      preauth silent deny=10 unlock_time=120"
        backrefs: false

    - name: Configure auth failure
      ansible.builtin.lineinfile:
        path: /etc/pam.d/system-auth
        regexp: "^(auth\\s+\\[default=die\\]\\s+pam_faillock\\.so)\\s+authfail.*$"
        line: "auth       [default=die]               pam_faillock.so      authfail deny=10 unlock_time=120"
        backrefs: false

    - name: Configure deny limit
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: "^#?\\s*deny\\s*=.*$"
        line: "deny = 10"

- name: Configure power profiles daemon on laptops
  become: true
  when: is_arch and has_battery
  block:
    - name: Install package
      ansible.builtin.package:
        name: power-profiles-daemon
        state: present

    - name: Enable service
      ansible.builtin.systemd_service:
        name: power-profiles-daemon.service
        enabled: true
        state: started

- name: Install desktop control packages
  ansible.builtin.package:
    name: "{{ pkgs[ansible_facts['os_family']] }}"
    state: present
  become: true
  when: is_managed_desktop and ansible_facts['os_family'] in pkgs
  vars:
    pkgs:
      Archlinux:
        - xdg-utils
        - ddcutil
        - wl-clipboard
        - gnome-keyring
        - libsecret
        - wtype
        - reflector
        - brightnessctl
        - acpi
      RedHat:
        - xdg-utils
        - ddcutil
        - wl-clipboard
        - gnome-keyring
        - libsecret
        - wtype
        - brightnessctl
        - acpi
        - fwupd

- name: Install fun terminal packages on Arch
  ansible.builtin.package:
    name:
      - perl-curses
      - perl-term-animation
      - cowsay
      - ponysay
      - countryfetch
      - lolcat
      - fortune-mod
      - sl
      - espeak-ng
      - toilet
      - nyancat
    state: present
  become: true
  when: is_arch and is_managed_desktop

- name: Install cmatrix AUR package
  kewlfft.aur.aur:
    name: cmatrix-git
    state: present
  when: is_arch and is_managed_desktop

- name: Install lavat # noqa command-instead-of-module
  ansible.builtin.shell: |
    git clone --depth 1 https://github.com/AngelJumbo/lavat.git /tmp/lavat
    make -C /tmp/lavat install
    rm -rf /tmp/lavat
  args:
    creates: /usr/local/bin/lavat
  become: true
  when: is_linux and is_managed_desktop

- name: Clone wallpapers
  ansible.builtin.git:
    repo: https://github.com/dommcdev/wallpapers.git
    dest: "{{ home }}/dev/wallpapers"
    version: main
    update: false
  when: is_managed_desktop

- name: Configure GrandOrgue
  when: is_linux and is_managed_desktop
  block:
    - name: Install GrandOrgue Flatpak
      community.general.flatpak:
        name: net.sourceforge.GrandOrgue
        remote: flathub
        method: system
        state: present
      become: true

    - name: Create config directory
      ansible.builtin.file:
        path: "{{ home }}/.config/GrandOrgue"
        state: directory
        mode: "0755"

    - name: Configure Flatpak overrides
      ansible.builtin.command: "flatpak override --user {{ item }} net.sourceforge.GrandOrgue"
      changed_when: false
      loop:
        - "--env=HOME={{ home }}/.config/GrandOrgue"
        - "--env=PIPEWIRE_LATENCY=128/48000"

- name: Link screensaver scripts
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ home }}/.local/bin/{{ item | basename }}"
    state: link
    force: true
  loop: "{{ lookup('ansible.builtin.fileglob', root + '/screensaver/scripts/*', wantlist=True) }}"
  when: is_managed_desktop

- name: Install screensaver text effects package
  kewlfft.aur.aur:
    name: python-terminaltexteffects
    state: present
  when: is_arch and is_managed_desktop

- name: Configure Timeshift
  become: true
  when: is_arch and is_managed_desktop
  block:
    - name: Install packages
      ansible.builtin.package:
        name:
          - timeshift
          - btrfs-progs
          - xorg-xhost
          - cronie
        state: present

    - name: Create config directory
      ansible.builtin.file:
        path: /etc/timeshift
        state: directory
        mode: "0755"

    - name: Copy config
      ansible.builtin.copy:
        src: "{{ root }}/timeshift/timeshift.json"
        dest: /etc/timeshift/timeshift.json
        mode: "0644"
        remote_src: true

    - name: Enable cronie
      ansible.builtin.systemd_service:
        name: cronie.service
        enabled: true
        state: started
