- name: Disable Ubuntu MOTD scripts
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0644"
  become: true
  loop: "{{ lookup('ansible.builtin.fileglob', '/etc/update-motd.d/*', wantlist=True) }}"
  when: is_ubuntu

- name: Configure Fedora DNF defaults
  ansible.builtin.blockinfile:
    path: /etc/dnf/dnf.conf
    marker: "# {mark} ANSIBLE DOTFILES DNF DEFAULTS"
    block: |
      max_parallel_downloads=10
      fastestmirror=True
      defaultyes=True
  become: true
  when: is_fedora

- name: Create some dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ home }}/Downloads/Screenshots"
    - "{{ home }}/Downloads/Videos"
    - "{{ home }}/programs"
    - "{{ home }}/backups"

- name: Install miscellaneous system packages
  ansible.builtin.package:
    name: "{{ pkgs[ansible_facts['os_family']] }}"
    state: present
  become: true
  when: is_managed_desktop and ansible_facts['os_family'] in pkgs
  vars:
    pkgs:
      Archlinux:
        - downgrade
        - reflector
