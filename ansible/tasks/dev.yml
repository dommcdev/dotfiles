- name: Install development packages on Arch
  ansible.builtin.package:
    name:
      - jdk-openjdk
      - clang
      - python
      - python-pip
      - deno
      - uv
      - github-cli
      - nodejs
      - npm
      - rust
      - typst
    state: present
  become: true
  when: is_arch

- name: Install development packages with Homebrew
  community.general.homebrew:
    name:
      - java
      - llvm
      - python
      - typst
      - deno
      - node
      - uv
      - gh
      - rust
    state: present
    update_homebrew: false
  when: is_ubuntu or is_fedora or is_macos

- name: Ensure dev directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ home }}/dev/projects"
    - "{{ home }}/dev/external"

- name: Install gh markdown preview extension
  ansible.builtin.command: gh extension install yusukebe/gh-markdown-preview
  changed_when: false
  failed_when: false

#https://github.com/kewlfft/ansible-aur/pull/79
- name: Install Beancount and Fava
  block:
    - name: Install beancount AUR tools on Arch
      become: true
      become_user: aur_builder
      ansible.builtin.command: yay -S --noconfirm --needed --cleanafter beancount fava
      register: beancount_aur_install
      changed_when: "'nothing to do' not in beancount_aur_install.stdout | lower"
      when: is_arch

    - name: Install beancount tools with Homebrew
      community.general.homebrew:
        name:
          - beancount
          - fava
        state: present
        update_homebrew: false
      when: is_ubuntu or is_fedora or is_macos
