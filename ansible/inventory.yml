all:
  hosts:
    chocobo:
      ansible_host: chocobo.tetra-salmon.ts.net
      ansible_become_exe: /usr/bin/sudo.ws
      #TODO remove the above stupid workaround once this merges: https://github.com/ansible/ansible/pull/86964
    kabigon:
      ansible_host: kabigon.tetra-salmon.ts.net
      gpu_vendors:
        - amd
        - nvidia
    pikachu:
      ansible_host: pikachu.tetra-salmon.ts.net
      gpu_vendors:
        - intel

  vars:
    ansible_connection: "{{ 'local' if inventory_hostname == lookup('pipe', 'hostname -s') else 'ssh' }}"
    root: "{{ playbook_dir }}/.."
    home: "{{ ansible_facts['env']['HOME'] }}"
    user: "{{ ansible_facts['user_id'] }}"

    brew_environment:
      PATH: "/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin"

    # Restate some Ansible gathered facts for greater ease of use
    is_arch: "{{ (ansible_facts['distribution'] | lower) in ['arch', 'archlinux', 'cachyos'] }}"
    is_ubuntu: "{{ (ansible_facts['distribution'] | lower) in ['ubuntu', 'debian', 'linuxmint'] }}"
    is_fedora: "{{ (ansible_facts['distribution'] | lower) == 'fedora' }}"
    is_macos: "{{ ansible_facts['system'] == 'Darwin' }}"
    is_linux: "{{ ansible_facts['system'] == 'Linux' }}"

    # Inventory-defined facts
    is_headless: false
    is_managed_desktop: false
    is_hardened: false
    has_battery: false
    has_fingerprint_reader: false
    gpu_vendors: []

  children:
    servers:
      hosts:
        chocobo:
      vars:
        is_headless: true
        is_hardened: true

    workstations:
      hosts: {}

    custom:
      hosts:
        kabigon:
        pikachu:
      vars:
        is_managed_desktop: true

    laptops:
      hosts:
        pikachu:
      vars:
        has_battery: true
        has_fingerprint_reader: true
