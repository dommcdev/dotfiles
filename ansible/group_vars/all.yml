dotfiles_root: "{{ playbook_dir }}/.."
dotfiles_home: "{{ ansible_env.HOME }}"
dotfiles_user: "{{ ansible_user_id }}"

brew_environment:
  PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_env.PATH }}"

dotfiles_os_id: "{{ 'mac' if ansible_system == 'Darwin' else (ansible_distribution | lower) }}"
dotfiles_is_arch: "{{ dotfiles_os_id in ['arch', 'archlinux'] }}"
dotfiles_is_ubuntu: "{{ dotfiles_os_id == 'ubuntu' }}"
dotfiles_is_fedora: "{{ dotfiles_os_id == 'fedora' }}"
dotfiles_is_macos: "{{ ansible_system == 'Darwin' }}"
dotfiles_is_linux: "{{ ansible_system == 'Linux' }}"
dotfiles_is_desktop: "{{ 'desktops' in group_names or 'custom' in group_names }}"
dotfiles_is_custom: "{{ 'custom' in group_names }}"

