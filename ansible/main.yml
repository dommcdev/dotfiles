- name: Install Ansible deps
  hosts: all
  gather_facts: false

  vars_files:
    - secrets.yml

  vars:
    ansible_become_password: "{{ become_passwords[inventory_hostname] }}"

  tasks:
    - name: Install Python when missing
      ansible.builtin.raw: |
        if command -v python3 >/dev/null 2>&1; then
          exit 0
        elif command -v pacman >/dev/null 2>&1; then
          pacman -Syu --needed --noconfirm python
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          apt-get install -y python3
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3
        else
          echo "Unsupported package manager" >&2
          exit 1
        fi

        echo "PYTHON_BOOTSTRAPPED"
      become: true
      register: python_bootstrap
      changed_when: "'PYTHON_BOOTSTRAPPED' in python_bootstrap.stdout"

- name: Configure machines
  hosts: all
  gather_facts: true

  vars_files:
    - secrets.yml

  vars:
    ansible_become_password: "{{ become_passwords[inventory_hostname] }}"

  pre_tasks: []

  tasks:
    # Clone dotfiles, grab essential deps, package managers, etc
    - name: Prerequisites
      ansible.builtin.import_tasks: tasks/prereqs.yml

      # Setup ssh access before nuking password auth later on
    - name: Tailscale
      ansible.builtin.import_tasks: tasks/apps/tailscale.yml

      # Install useful packages early on (e.g. unzip)
    - name: CLI Utilties
      ansible.builtin.import_tasks: tasks/apps/cli.yml

    - name: Drivers and media codecs
      ansible.builtin.include_tasks: tasks/system/drivers.yml
      when: is_managed_desktop and is_linux
    - name: TUI Applications
      ansible.builtin.import_tasks: tasks/apps/tui.yml
    - name: Script links
      ansible.builtin.include_tasks: tasks/apps/scripts.yml
    - name: Syncthing
      ansible.builtin.include_tasks: tasks/apps/syncthing.yml
    - name: Network
      ansible.builtin.include_tasks: tasks/system/network.yml
      when: is_managed_desktop and is_linux
    - name: Printing
      ansible.builtin.include_tasks: tasks/system/printing.yml
      when: is_managed_desktop and is_linux
    - name: Appearance
      ansible.builtin.include_tasks: tasks/system/appearance.yml
      when: is_linux and is_managed_desktop
    - name: Hyprland
      ansible.builtin.include_tasks: tasks/apps/hyprland.yml
      when: is_managed_desktop and (is_arch or is_fedora)
    - name: Keyd
      ansible.builtin.include_tasks: tasks/apps/keyd.yml
      when: is_linux
    - name: SSH
      ansible.builtin.import_tasks: tasks/apps/ssh.yml
    - name: Git
      ansible.builtin.import_tasks: tasks/apps/git.yml
    - name: Development environment
      ansible.builtin.include_tasks: tasks/apps/dev.yml
      when: is_dev_env
    - name: Zsh
      ansible.builtin.import_tasks: tasks/apps/zsh.yml
    - name: Opencode
      ansible.builtin.import_tasks: tasks/apps/opencode.yml
    - name: Docker
      ansible.builtin.import_tasks: tasks/apps/docker.yml
    - name: Libvirt
      ansible.builtin.import_tasks: tasks/apps/libvirt.yml
      when: is_linux
    - name: Fonts
      ansible.builtin.import_tasks: tasks/apps/fonts.yml
    - name: Ghostty
      ansible.builtin.import_tasks: tasks/apps/ghostty.yml
    - name: Vicinae
      ansible.builtin.include_tasks: tasks/apps/vicinae.yml
      when: is_managed_desktop and is_linux and (not is_ubuntu)
    - name: Zed
      ansible.builtin.import_tasks: tasks/apps/zed.yml
    - name: Nvim
      ansible.builtin.import_tasks: tasks/apps/nvim.yml
    - name: Noctalia
      ansible.builtin.import_tasks: tasks/apps/noctalia.yml
      when: is_managed_desktop and is_arch
