- name: Prepare machines
  hosts: all
  gather_facts: false

  vars:
    machine_password: >-
      {{ lookup('ansible.builtin.ini',
        'ansible_' ~ inventory_hostname ~ '_password',
        type='properties', file=playbook_dir ~ '/../.env',
        default='', interpolation=false) }}
    tailscale_auth_key: >-
      {{ lookup('ansible.builtin.ini', 'tailscale_auth_key',
        type='properties', file=playbook_dir ~ '/../.env',
        default='', interpolation=false) }}

  tasks:
    - name: Use stored machine password when available
      ansible.builtin.set_fact:
        ansible_password: "{{ machine_password }}"
        ansible_become_password: "{{ machine_password }}"
      when: machine_password | length > 0
      no_log: true

    - name: Prompt for machine password when not stored
      ansible.builtin.pause:
        prompt: SSH/sudo password
        echo: false
      register: machine_password_prompt
      when:
        - prompt_for_machine_password | default(false) | bool
        - machine_password | length == 0
      no_log: true

    - name: Use prompted machine password
      ansible.builtin.set_fact:
        ansible_password: "{{ machine_password_prompt.user_input }}"
        ansible_become_password: "{{ machine_password_prompt.user_input }}"
      when:
        - prompt_for_machine_password | default(false) | bool
        - machine_password | length == 0
      no_log: true

    - name: Preserve Tailscale auth key for configuration
      ansible.builtin.set_fact:
        ts_auth_key: "{{ tailscale_auth_key }}"
      when: tailscale_auth_key | length > 0
      no_log: true

    - name: Install Python when missing
      ansible.builtin.raw: |
        if command -v python3 >/dev/null 2>&1; then
          exit 0
        elif command -v pacman >/dev/null 2>&1; then
          pacman -S --needed --noconfirm python
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          apt-get install -y python3
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3
        else
          echo "Unsupported package manager" >&2
          exit 1
        fi

        echo "PYTHON_BOOTSTRAPPED"
      become: true
      register: python_bootstrap
      changed_when: "'PYTHON_BOOTSTRAPPED' in python_bootstrap.stdout"

      # Now that python is guaranteed, Ansible can operate fully, including gathering facts
    - name: Gather facts
      ansible.builtin.setup:

- name: Configure machines
  hosts: all
  gather_facts: false

  # This block only works if facts have been gathered in a previous play
  environment:
    XDG_CONFIG_HOME: "{{ home }}/.config"
    XDG_DATA_HOME: "{{ home }}/.local/share"
    XDG_CACHE_HOME: "{{ home }}/.cache"
    XDG_STATE_HOME: "{{ home }}/.local/state"
    CARGO_HOME: "{{home }}/.local/share/cargo"

  tasks:
    # Clone dotfiles, grab essential deps, package managers, etc
    - name: Prerequisites
      ansible.builtin.import_tasks: tasks/prereqs.yml

      # Setup ssh access before nuking password auth later on
    - name: Tailscale
      ansible.builtin.import_tasks: tasks/apps/tailscale.yml

      # Includes audio stack, so we need to install now to prevent a random package from pulling in e.g. jack
    - name: Desktop environment packages
      ansible.builtin.include_tasks: tasks/system/desktop-env.yml
      when: is_managed_desktop

      # Install useful packages early on (e.g. unzip)
    - name: CLI Utilties
      ansible.builtin.import_tasks: tasks/apps/cli.yml

    - name: Git
      ansible.builtin.import_tasks: tasks/apps/git.yml
    - name: Zsh
      ansible.builtin.import_tasks: tasks/apps/zsh.yml
    - name: Nvim
      ansible.builtin.import_tasks: tasks/apps/nvim.yml
    - name: Script links
      ansible.builtin.include_tasks: tasks/apps/scripts.yml
    - name: TUI Applications
      ansible.builtin.import_tasks: tasks/apps/tui.yml
    - name: Development environment
      ansible.builtin.include_tasks: tasks/dev.yml
      when: is_dev_env
    - name: Opencode
      ansible.builtin.import_tasks: tasks/apps/opencode.yml
    - name: Misc
      ansible.builtin.import_tasks: tasks/misc.yml
    - name: Syncthing
      ansible.builtin.include_tasks: tasks/apps/syncthing.yml
    - name: Docker
      ansible.builtin.import_tasks: tasks/apps/docker.yml
    - name: Libvirt
      ansible.builtin.import_tasks: tasks/apps/libvirt.yml
      when: is_linux
    - name: Network
      ansible.builtin.include_tasks: tasks/system/network.yml
      when: is_managed_desktop
    - name: Keyd
      ansible.builtin.include_tasks: tasks/apps/keyd.yml
      when: is_linux and (not is_headless)
    - name: Drivers and media codecs
      ansible.builtin.include_tasks: tasks/system/drivers.yml
      when: is_managed_desktop
    - name: Hyprland
      ansible.builtin.include_tasks: tasks/apps/hyprland.yml
      when: is_managed_desktop and (is_arch or is_fedora)
    - name: Fonts
      ansible.builtin.import_tasks: tasks/apps/fonts.yml
      when: not is_headless
    - name: Appearance
      ansible.builtin.include_tasks: tasks/system/appearance.yml
      when: is_managed_desktop
    - name: Ghostty
      ansible.builtin.import_tasks: tasks/apps/ghostty.yml
      when: not is_headless
    - name: Browser
      ansible.builtin.import_tasks: tasks/apps/browser.yml
      when: not is_headless
    - name: GUI Applications
      ansible.builtin.import_tasks: tasks/apps/gui.yml
      when: not is_headless
    - name: Noctalia
      ansible.builtin.import_tasks: tasks/apps/noctalia.yml
      when: is_managed_desktop and is_arch
    - name: Vicinae
      ansible.builtin.include_tasks: tasks/apps/vicinae.yml
      when: is_managed_desktop and (not is_ubuntu)
    - name: Zed
      ansible.builtin.import_tasks: tasks/apps/zed.yml
      when: is_dev_env and (not is_headless)
    - name: Printing
      ansible.builtin.include_tasks: tasks/system/printing.yml
      when: is_managed_desktop
    - name: GrandOrgue
      ansible.builtin.include_tasks: tasks/apps/grandorgue.yml
      when: setup_grandorgue
    - name: SSH #Put this near the end since it changes ssh stuff which affects Ansible
      ansible.builtin.import_tasks: tasks/apps/ssh.yml
