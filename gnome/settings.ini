[org/gnome/shell]
enabled-extensions=['scrollwork@dommcdev.github.io']

[org/gnome/mutter]
overlay-key=''
dynamic-workspaces=false
attach-modal-dialogs=false
center-new-windows=true

[org/gnome/desktop/wm/preferences]
num-workspaces=10
focus-mode='click'
mouse-button-modifier='<Super>'
resize-with-right-button=true

[org/gnome/desktop/interface]
enable-hot-corners=false

[org/gnome/desktop/peripherals/keyboard]
repeat-interval=uint32 22

[org/gnome/desktop/peripherals/touchpad]
natural-scroll=false
tap-to-click=true
click-method='fingers'
disable-while-typing=false

[org/gnome/desktop/wm/keybindings]
close=['<Super>x']
toggle-fullscreen=['<Super><Shift>d']
switch-applications=['<Alt>Tab']
switch-applications-backward=['<Shift><Alt>Tab']

[org/gnome/mutter/wayland/keybindings]
switch-to-session-1=['<Control><Alt>F1']
switch-to-session-2=['<Control><Alt>F2']
switch-to-session-3=['<Control><Alt>F3']
switch-to-session-4=['<Control><Alt>F4']
switch-to-session-5=['<Control><Alt>F5']
switch-to-session-6=['<Control><Alt>F6']
switch-to-session-7=['<Control><Alt>F7']
switch-to-session-8=['<Control><Alt>F8']
switch-to-session-9=['<Control><Alt>F9']
switch-to-session-10=['<Control><Alt>F10']
switch-to-session-11=['<Control><Alt>F11']
switch-to-session-12=['<Control><Alt>F12']

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/launcher/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/terminal/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/browser/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/browser-private/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/files/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/yazi/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/notes/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/calculator/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/audio/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/bluetooth/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/system-monitor/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/wifi/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/network-restart/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/grandorgue/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/gemini/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/chatgpt/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/parabolic/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/watch-later/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/settings/']
screensaver=['<Super>q']
volume-up=['XF86AudioRaiseVolume']
volume-down=['XF86AudioLowerVolume']
volume-mute=['XF86AudioMute']
mic-mute=['XF86AudioMicMute']
next=['XF86AudioNext']
previous=['XF86AudioPrev']
play=['XF86AudioPlay']
pause=['XF86AudioPause']
power=['XF86PowerOff']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/launcher]
name='Vicinae'
command='vicinae toggle'
binding='<Control>apostrophe'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/terminal]
name='Terminal'
command='ghostty +new-window'
binding='<Super>Return'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/browser]
name='Browser'
command='google-chrome-stable'
binding='<Super>b'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/browser-private]
name='Private browser'
command='google-chrome-stable --incognito'
binding='<Super><Shift>b'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/files]
name='Files'
command='nautilus --new-window'
binding='<Super>f'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/yazi]
name='Yazi'
command='ghostty -e yazi'
binding='<Super><Shift>f'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/notes]
name='Obsidian'
command='obsidian'
binding='<Super>n'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/calculator]
name='Calculator'
command='ghostty --class=com.dominic.calc -e qalc'
binding='<Super>t'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/audio]
name='Audio mixer'
command='ghostty --class=com.dominic.wiremix -e wiremix'
binding='<Super>r'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/bluetooth]
name='Bluetooth'
command='ghostty --class=com.dominic.bluetui -e bluetui'
binding='<Super>e'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/system-monitor]
name='System monitor'
command='ghostty --class=com.dominic.btop -e btop'
binding='<Super>u'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/wifi]
name='WiFi'
command='ghostty --class=com.dominic.wlctl -e wlctl'
binding='<Super>w'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/network-restart]
name='Restart NetworkManager'
command='systemctl restart NetworkManager'
binding='<Super><Shift>w'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/grandorgue]
name='GrandOrgue'
command='sh -c "$HOME/.local/bin/launch-grandorgue.sh"'
binding='<Alt>g'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/gemini]
name='Gemini'
command='google-chrome-stable --app=https://gemini.google.com/app'
binding='<Super>i'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/chatgpt]
name='ChatGPT'
command='google-chrome-stable --app=https://chatgpt.com'
binding='<Super><Shift>i'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/parabolic]
name='Parabolic'
command='flatpak run org.nickvision.tubeconverter'
binding='<Super>y'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/watch-later]
name='Watch Later'
command='google-chrome-stable --app=https://youtube.com/playlist?list=WL'
binding='<Super><Shift>y'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/settings]
name='Settings'
command='gnome-control-center'
binding='<Super><Shift>comma'

[org/gnome/shell/keybindings]
screenshot=['Print', '<Super>s']
show-screenshot-ui=['<Shift>Print', '<Super><Shift>s', '<Super><Alt>s']
focus-active-notification=['<Super><Shift>a']
screen-brightness-up=['XF86MonBrightnessUp']
screen-brightness-down=['XF86MonBrightnessDown']

[org/gnome/shell/extensions/scrollwork]
window-rules='[{"appId":"vicinae","mode":"float","center":true},{"appId":"com.dominic.wlctl","mode":"float","center":true,"size":[0.55,0.55]},{"appId":["com.dominic.bluetui","com.dominic.wiremix"],"mode":"float","center":true,"size":[0.5,0.5]},{"appId":"com.dominic.calc","mode":"float","center":true,"size":[0.3,0.5]},{"appId":"com.dominic.btop","mode":"float","center":true,"size":[0.7,0.7]},{"appId":"com.dominic.cal","mode":"float","center":true,"size":[750,820]},{"appId":"com.dominic.powerbutton","mode":"float","center":true,"size":[500,250]},{"appId":"com.dominic.screensaver","mode":"float","fullscreen":true},{"appId":"GrandOrgue","initialTitle":"^(Open organ|Program Settings)$","mode":"float","center":true,"size":[0.7,0.75]}]'
hover-focus=true
warp-pointer=true
edge-hints=true
movement-duration=150
border-fade-duration=539
focus-fade-duration=303
style-windows=true
corner-radius=15
border-width=3
active-border='#cba6f7'
inactive-border='#1e1e2e'
inactive-opacity=0.97
focus-left=['<Super>h']
focus-right=['<Super>l']
move-left=['<Super><Control>h']
move-right=['<Super><Control>l']
cycle-width=['<Super>d']
toggle-floating=['<Super>g']
center-column=['<Super>c']
scrollwork-dismiss-notification=['<Super>a']
scrollwork-color-picker=['<Super><Shift>p']
workspace-1=['<Super>1']
workspace-2=['<Super>2']
workspace-3=['<Super>3']
workspace-4=['<Super>4']
workspace-5=['<Super>5']
workspace-6=['<Super>6']
workspace-7=['<Super>7']
workspace-8=['<Super>8']
workspace-9=['<Super>9']
workspace-10=['<Super>0']
scrollwork-move-to-workspace-1=['<Super><Shift>1']
scrollwork-move-to-workspace-2=['<Super><Shift>2']
scrollwork-move-to-workspace-3=['<Super><Shift>3']
scrollwork-move-to-workspace-4=['<Super><Shift>4']
scrollwork-move-to-workspace-5=['<Super><Shift>5']
scrollwork-move-to-workspace-6=['<Super><Shift>6']
scrollwork-move-to-workspace-7=['<Super><Shift>7']
scrollwork-move-to-workspace-8=['<Super><Shift>8']
scrollwork-move-to-workspace-9=['<Super><Shift>9']
scrollwork-move-to-workspace-10=['<Super><Shift>0']
